name: Smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        shell: pwsh
        env:
          ONI_INDEX_PATH: ${{ github.workspace }}/android-project/app/src/main/assets/index.html
        run: |
          ./scripts/smoke-test.ps1