name: Smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Index.html from zip
        run: |
          mkdir -p /tmp/oni
          unzip -o "On.i-CRM-Android-Project-v13-Kaspi-SmartPOS.zip" -d /tmp/oni

      - name: Find Index.html
        id: find
        run: |
          P=$(find /tmp/oni -type f -name "Index.html" | head -n 1)
          echo "path=$P" >> "$GITHUB_OUTPUT"

      - name: Run smoke test
        env:
          ONI_INDEX_PATH: ${{ steps.find.outputs.path }}
        shell: pwsh
        run: |
          ./scripts/smoke-test.ps1