name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Prepare
        shell: bash
        run: bash .github/b.sh

      - name: Build Debug APK
        shell: bash
        run: |
          set +e
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/g.log
          RC=${PIPESTATUS[0]}
          echo "=========== KEY LINES ==========="
          grep -E "error:|BUILD |Could not|java patched|WARNING|callback|method" /tmp/g.log | head -40 || true
          echo "================================="
          exit $RC

      - name: Find APK
        if: success()
        shell: bash
        run: |
          set -e
          A=$(find "$PROJECT_DIR" -type f -path '*/apk/debug/*.apk' | head -1)
          [ -z "$A" ] && { find "$PROJECT_DIR" -name '*.apk'; exit 1; }
          echo "APK_FILE=$A" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: On-i-CRM-debug-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14