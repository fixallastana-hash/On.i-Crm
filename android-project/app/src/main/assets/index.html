<script>
  /* Phone B: IndexedDB в этом Chrome Android сломан ГЛОБАЛЬНО 
     (UnknownError: Internal error opening backing store).
     Это проверено и в content://, и в https:// — Firefox/Chrome 
     WebView на этом устройстве не может открыть IDB-базисы.
     Отключаем window.indexedDB до загрузки Firebase SDK, чтобы 
     SDK перешёл на inMemoryPersistence. Иначе signIn виснет.
     Firestore при этом работает нормально.
     Полный бэкап в IDB не сохраняется — saveFullBackupNow уже 
     имеет guard на отсутствие IDB и тихо выходит. */
  (function(){
    try {
      Object.defineProperty(window, 'indexedDB', {
        configurable: true,
        get: function(){ return undefined; }
      });
      window.__IDB_PATCH_ACTIVE__ = true;
    } catch(e) {
      try { window.indexedDB = undefined; window.__IDB_PATCH_ACTIVE__ = true; } catch(e2) {
        console.warn('[patch] indexedDB override failed', e, e2);
      }
    }
  })();
</script>
    <script>
      (function(){
        var diag = [];
        diag.push('proto=' + String(location.protocol));
        diag.push('idb=' + (typeof window.indexedDB));
        diag.push('patch=' + String(window.__IDB_PATCH_ACTIVE__));
        diag.push('UA=' + navigator.userAgent.slice(0,60));
        diag.push('sw=' + (navigator.serviceWorker ? 'yes' : 'no'));
        diag.push('bc=' + (typeof BroadcastChannel));
        diag.push('fbatch=' + (window.firebase && firebase.SDK_VERSION ? firebase.SDK_VERSION : '—'));
        window.__ENV_DIAG__ = diag;
      })();
    </script>

<style id="oni-ios-switch-css">
.oni-switch{position:relative;display:inline-block;width:50px;height:30px;flex:0 0 auto;}
.oni-switch input{opacity:0;width:0;height:0;position:absolute;}
.oni-switch-slider{position:absolute;inset:0;cursor:pointer;background:#d1d1d6;border-radius:30px;transition:.2s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.oni-switch-slider:before{content:"";position:absolute;width:26px;height:26px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.28);}
.oni-switch input:checked + .oni-switch-slider{background:#34c759;}
.oni-switch input:checked + .oni-switch-slider:before{transform:translateX(20px);}
.oni-switch input:focus-visible + .oni-switch-slider{outline:2px solid rgba(0,122,255,.45);outline-offset:2px;}
</style>

<style id="oni-modern-ui-v16">
/* Modern mobile UI: clean, soft, premium controls without changing app logic */
:root{--ui-radius:14px;--ui-shadow:0 4px 14px rgba(20,24,40,.06);--ui-shadow-strong:0 8px 24px rgba(20,24,40,.10);}
button{transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease,border-color .12s ease,opacity .12s ease;}
button:active{transform:scale(.975);}
.btn{min-height:40px;padding:10px 15px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(20,24,40,.04);}
.btn:hover{box-shadow:var(--ui-shadow);border-color:#D5D9E0;}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 5px 14px rgba(20,160,90,.20);}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 7px 18px rgba(20,160,90,.24);}
.btn-block{min-height:46px;border-radius:13px;}
.topbar-action{width:40px;height:40px;border-radius:12px;background:var(--surface);border-color:var(--border);box-shadow:0 2px 8px rgba(20,24,40,.06);}
.topbar-menu{border-radius:16px;box-shadow:var(--ui-shadow-strong);padding:7px;border-color:#DDE1E7;}
.topbar-menu button{min-height:42px;padding:10px 12px;border-radius:11px;font-weight:600;}
.topbar-menu button:active{background:var(--surface-2);}
.chip{min-height:36px;padding:8px 14px;border-radius:18px;background:var(--surface);box-shadow:0 1px 2px rgba(20,24,40,.03);font-weight:700;}
.chip.active{box-shadow:0 4px 12px rgba(47,111,237,.18);}
.seg-tabs{border-radius:13px;padding:4px;background:#EEF0F3;}
.seg-tab{min-height:38px;border-radius:10px;font-weight:700;}
.seg-tab.active{box-shadow:0 2px 8px rgba(20,24,40,.08);}
.type-btn,.pay-btn,.discount-btn{min-height:40px;border-radius:11px;font-weight:700;box-shadow:0 1px 2px rgba(20,24,40,.03);}
.move-action,.history-link,.return-btn{min-height:32px;padding:7px 10px;border-radius:10px;background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(20,24,40,.04);}
.qty-stepper{border-radius:11px;background:var(--surface);box-shadow:0 1px 2px rgba(20,24,40,.04);}
.qty-btn{width:30px;height:30px;border-radius:0;font-weight:700;}
.product-info-btn{width:28px;height:28px;}
.panel{border-radius:16px;box-shadow:var(--ui-shadow);border-color:#E0E4E9;}
.stat-card{border-radius:15px;box-shadow:var(--ui-shadow);}
.list-row{padding:13px 15px;}
.search input,.form-input,.form-select{min-height:42px;border-radius:12px;box-shadow:inset 0 1px 2px rgba(20,24,40,.025);}
.form-input:focus,.form-select:focus,.search input:focus{box-shadow:0 0 0 3px rgba(47,111,237,.10);}
.sheet{border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(20,24,40,.10);}
.sheet-close{width:32px;height:32px;border-radius:50%;font-size:14px;}
.cart-bar{border-radius:16px;box-shadow:0 10px 28px rgba(20,24,40,.25);}
.cart-bar-btn{min-height:40px;border-radius:11px;box-shadow:0 3px 10px rgba(20,160,90,.18);}
.chat-attach,.chat-camera,.chat-send{box-shadow:0 2px 7px rgba(20,24,40,.06);}
.auth-card{border-radius:20px;box-shadow:0 16px 42px rgba(20,24,40,.12);}
.ocr-box,.contact-box,.cash-settings,.visual-settings{border-radius:13px;}
</style>
<style id="oni-bottom-nav-v16-1">
.nav-tag.nav-icon{width:26px;height:22px;border-radius:0;background:transparent;color:currentColor;}
.nav-icon svg{width:21px;height:21px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.nav-btn.active .nav-tag.nav-icon{background:transparent;color:currentColor;}
.nav-btn.active .nav-icon svg{stroke-width:2.1;}
.nav-products-label{font-size:12.5px;font-weight:700;color:currentColor;}
</style>

<style id="oni-no-zoom">
html, body { touch-action: pan-x pan-y; -ms-touch-action: pan-x pan-y; }
</style>
<script id="oni-no-zoom-js">
(function(){
  try{
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
    document.addEventListener('gesturechange', function(e){ e.preventDefault(); }, {passive:false});
    document.addEventListener('gestureend', function(e){ e.preventDefault(); }, {passive:false});
    document.addEventListener('touchstart', function(e){
      if(e.touches && e.touches.length > 1){ e.preventDefault(); }
    }, {passive:false});
  }catch(e){}
})();
</script></head>

  var _fbSync = {
    timers: {},
    running: {},
    queued: {}
  };

  function _fbScheduleSync(collectionName){
    if(!fbDb) return;
    if(_fbSync.timers[collectionName]){
      clearTimeout(_fbSync.timers[collectionName]);
    }
    _fbSync.timers[collectionName]=setTimeout(function(){
      _fbSync.timers[collectionName]=null;
      _fbRunSync(collectionName);
    }, 3000);
  }

  async function _fbRunSync(collectionName){
    /* Фаза 1c-1: не пишем в Firestore без авторизации.
       Rules требуют request.auth != null. */
    if(!fbAuth || !fbAuth.currentUser){
      return;
    }
    var _log = function(){};
    _log('start, items=' + ((_fbGetCollectionData(collectionName)||[]).length));
    if(_fbSync.running[collectionName]){
      _fbSync.queued[collectionName]=true;
      return;
    }
    _fbSync.running[collectionName]=true;
    try{
      if(collectionName === 'products'){
        var _recentDelSync = {};
        try{ _recentDelSync = JSON.parse(localStorage.getItem('sklad_crm_recent_deletes') || '{}') || {}; }catch(e){}
        var _tombIds = Object.keys(_recentDelSync);
        if(_tombIds.length > 0){
          var _delBatch = fbDb.batch();
          for(var _ti=0; _ti<_tombIds.length; _ti++){
            var _tid = String(_tombIds[_ti]);
            var _safeTid = _tid.replace(/[\/\s]+/g, '_');
            var _tref = fbDb.collection('shops').doc(FB_SHOP_ID).collection(collectionName).doc(_safeTid);
            _delBatch.delete(_tref);
          }
          try{
            await _delBatch.commit();
            _log('tombstones deleted: ' + _tombIds.length);
            // tombstones НЕ удаляем - пусть живут 24 часа, чтобы pull смог их дообработать.
          }catch(e){
            _log('tombstone delete failed: ' + ((e && e.message) || e));
          }
        }
      }

      var data = _fbGetCollectionData(collectionName);
      if(!Array.isArray(data) || data.length === 0){
        return;
      }
      var CHUNK = 400;
      for(var i=0;i<data.length;i+=CHUNK){
        var batch=fbDb.batch();
        var slice=data.slice(i,i+CHUNK);
        for(var j=0;j<slice.length;j++){
          var item=slice[j];
          if(collectionName === 'users'){ var _u=Object.assign({}, item); delete _u.password; item = _u; }
          var id=String(item.id||('auto-'+i+'-'+j));
          var safeId=id.replace(/[\/\s]+/g,'_');
          var ref=fbDb.collection('shops').doc(FB_SHOP_ID).collection(collectionName).doc(safeId);
          batch.set(ref, item);
        }
        await batch.commit();
      }
      _log('committed OK');
    }catch(e){
      _log('FAILED: '+((e&&e.message)||e));
    }finally{
      _fbSync.running[collectionName]=false;
      if(_fbSync.queued[collectionName]){
        _fbSync.queued[collectionName]=false;
        _fbRunSync(collectionName);
      }
    }
  }

  /* Фаза 2: односторонняя подгрузка данных из Firestore в localStorage.
     Вызывается только при пустом localStorage — при холодном старте. */
  async function _fbPullFromFirestore(){
    if(!fbAuth || !fbAuth.currentUser) return false;
    if(!fbDb) return false;
    var pulled=0;
    var mapping=[
      {name:'products',           apply:function(a){products=a;}},
      {name:'movements',          apply:function(a){movements=a;}},
      {name:'orders',             apply:function(a){orders=a;}},
      {name:'debts',              apply:function(a){debts=a;}},
      {name:'consignments',       apply:function(a){consignments=a;}},
      {name:'contacts',           apply:function(a){contacts=a;}},
      {name:'suppliers',          apply:function(a){suppliers=a;}},
      {name:'purchases',          apply:function(a){purchases=a;}},
      {name:'procurementRequests',apply:function(a){procurementRequests=a;}},
      {name:'giftCards',          apply:function(a){giftCards=a;}},
      {name:'reminders',          apply:function(a){reminders=a;}},
      {name:'shifts',             apply:function(a){shifts=a;}},
      {name:'messages',           apply:function(a){messages=a;}},
      {name:'inventorySessions',  apply:function(a){inventorySessions=a;}},
      {name:'sessions',           apply:function(a){sessions=a;}},
      {name:'actionHistory',      apply:function(a){actionHistory=a;}},
      {name:'warehouses',         apply:function(a){warehouses=a;}},
      {name:'points',             apply:function(a){points=a;}}
    ];
    for(var i=0;i<mapping.length;i++){
      var m=mapping[i];
      try{
        var snap=await fbDb.collection('shops').doc(FB_SHOP_ID).collection(m.name).get();
        if(!snap || snap.size===0) continue;
        var arr=[];
        snap.forEach(function(doc){ arr.push(doc.data()); });
        if(arr.length===0) continue;
        m.apply(arr);
        pulled+=arr.length;
      }catch(e){
        console.warn('[fb-pull] '+m.name+' failed: '+(e&&e.message||e));
      }
    }
    // users[] в HTML — плоский массив. В Firestore users разложены по uid.
    // Тянем их тоже, чтобы логин продолжал работать.
    try{
      var usersSnap=await fbDb.collection('shops').doc(FB_SHOP_ID).collection('users').get();
      if(usersSnap && usersSnap.size>0){
        var usersArr=[];
        usersSnap.forEach(function(doc){ var _d=doc.data(); try{ var _l=(users||[]).find(function(u){return u.id===_d.id;}); if(_l&&_l.password)_d.password=_l.password; }catch(e){} usersArr.push(_d); });
        if(usersArr.length>0){ users=usersArr; pulled+=usersArr.length; }
      }
    }catch(e){}
    if(pulled===0) return false;
    // Сохраняем всё в localStorage.
    await Promise.all([
      persist('products'), persist('movements'), persist('orders'),
      persist('debts'), persist('consignments'), persist('contacts'),
      persist('suppliers'), persist('purchases'), persist('procurementRequests'),
      persist('giftCards'), persist('reminders'), persist('shifts'),
      persist('messages'), persist('inventorySessions'), persist('sessions'),
      persist('actionHistory'), persist('users'),
      persist('warehouses'), persist('points')
    ]);
    return true;
  }

    /* Фаза 4: периодический pull из Firestore для синхронизации 
       между устройствами. Не трогает UI, если ничего не изменилось. */
    /* onSnapshot: Firestore сам присылает изменения в products.
       Когда данные меняются — дёргаем pull немедленно (не ждём таймер). */
    function startProductsWatcher(){
      try{
        if(!fbAuth || !fbAuth.currentUser) return;
        if(!fbDb) return;
        if(window._productsWatcherUnsub){
          try{ window._productsWatcherUnsub(); }catch(e){}
          window._productsWatcherUnsub = null;
        }
        var initialFired = false;
        var unsub = fbDb.collection('shops').doc(FB_SHOP_ID).collection('products')
          .onSnapshot(function(snap){
            if(!initialFired){ initialFired = true; return; }
            var now = Date.now();
            if((now - _lastPersistAt) < 5000) return;
            try{ if(_fbSync.running && _fbSync.running.products) return; }catch(e){}
            setTimeout(function(){
              try{ _fbSyncPull().catch(function(){}); }catch(e){}
            }, 200);
          }, function(err){
            console.warn('[products-watcher]', err && err.message);
          });
        window._productsWatcherUnsub = unsub;
        console.log('[products-watcher] subscribed');
      }catch(e){ console.warn('[products-watcher] failed', e); }
    }
    function stopProductsWatcher(){
      try{
        if(window._productsWatcherUnsub){
          window._productsWatcherUnsub();
          window._productsWatcherUnsub = null;
          console.log('[products-watcher] unsubscribed');
        }
      }catch(e){}
    }

    var _fbSyncPullTimer = null;
    var _fbSyncPullRunning = false;

    async function _fbSyncPull(){
      if(_fbSyncPullRunning) return;
      var _log = function(){};
      _log('start, products=' + (products?products.length:'?') + ', lastPersist=' + Math.round((Date.now()-_lastPersistAt)) + 'ms ago');
      if(!fbAuth || !fbAuth.currentUser) return;
      if(!fbDb) return;
      // Если открыт любой модал — не трогаем UI.
      var modalRoot = document.getElementById('modal-root');

        var _roIds=['wh-ov','pt-ov','al-ov','analytics-ov','reports-ov','action-history-ov','preset-wizard-ov','inv-list-ov','reqs-ov','ph-ov','phub-ov','low-ov','req-detail-ov','inv-detail-ov','fiscal-ov'];
        var _ro=false;
        for(var _i=0;_i<_roIds.length;_i++){ if(modalRoot.querySelector('#'+_roIds[_i])){ _ro=true; break; } }
        if(!_ro) return;
      }
      // Если прямо сейчас идёт запись в Firestore — пропускаем.
      var syncBusy = false;
      try{
        for(var k in _fbSync.running){ if(_fbSync.running[k]) { syncBusy = true; break; } }
      }catch(e){}
      // Фаза 4 fix: защита от гонки. Если persist() вызывался в последние 
      // 15 секунд, значит запись в Firestore ещё может не завершиться. 
      // Pull в этом окне может вернуть СТАРУЮ версию и перетереть свежие 
      // локальные изменения.
      if(!syncBusy && (Date.now() - _lastPersistAt) < 15000){ syncBusy = true; }
      if(syncBusy) return;

      _fbSyncPullRunning = true;
      try{
                // HARD DELETE: убрать локальные товары, которых нет в Firestore > 60 сек
        try{
          var _fsSnapH = await fbDb.collection('shops').doc(FB_SHOP_ID).collection('products').get();
          var _fsIdsH = {};
          _fsSnapH.forEach(function(doc){
            var d = doc.data() || {};
            if(d && d.id) _fsIdsH[String(d.id)] = true;
            if(doc.id) _fsIdsH[String(doc.id)] = true;
          });
          var _tombH = {};
          try{
            var _localH = JSON.parse(localStorage.getItem('sklad_crm_recent_deletes') || '{}') || {};

          {name:'orders',              apply:function(a){orders=a;},              get:function(){return orders;}},

            if(arr.length > 0){

              for(var li=0; li<local.length; li++){

                  }
                }catch(e){}
              }
              var _recentDel = {};
              try{ _recentDel = JSON.parse(localStorage.getItem('sklad_crm_recent_deletes') || '{}') || {}; }catch(e){}
              for(var ai=0; ai<arr.length; ai++){

                  if(_di !== -1){ local.splice(_di, 1); changed = true; }

                }
                var localItem = localById[item.id];
                if(!localItem){
                  local.push(item);
                  added++;
                  continue;
                }
                if(!m.merge) continue;
                var sT = Date.parse(item.updatedAt || item.createdAt || 0) || 0;
                var lT = Date.parse(localItem.updatedAt || localItem.createdAt || 0) || 0;
                if(sT > lT){
                  Object.keys(item).forEach(function(k){ localItem[k] = item[k]; });

              }
              if(added > 0 || updated > 0){

          for(var _ti=0; _ti<_tombKeys.length; _ti++){
            var _k = String(_tombKeys[_ti]);
            if(_nowT - Number(_tombNow[_k]) > 86400000){ _removedTomb++; continue; }
            _alive[_k] = _tombNow[_k];
          }
          if(_removedTomb > 0){
            try{ localStorage.setItem('sklad_crm_recent_deletes', JSON.stringify(_alive)); }catch(e){}
          }
          var _aliveKeys = Object.keys(_alive);

            }
            try{

            }catch(e){ _log('tombstone batch failed: ' + ((e && e.message) || e)); }
            var _tombSet = {};

            products = products.filter(function(p){ return !p || !_tombSet[String(p.id)]; });

            }
          }
        }
      }catch(e){ _log('tombstone pull error: ' + ((e && e.message) || e)); }

      if(!_employeeCheckedOnce && fbAuth && fbAuth.currentUser && activeUser && activeUser.id!=='admin'){

/* ===== PHOTO STORAGE ===== */
function _compressImage(dataUrl, maxSize, quality){
  return new Promise(function(resolve){
    try{
      var img = new Image();
      img.onload = function(){
        try{
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if(!w || !h){ resolve(dataUrl); return; }
          var scale = Math.min(1, (maxSize||1280) / Math.max(w, h));
          var nw = Math.round(w * scale);
          var nh = Math.round(h * scale);
          var canvas = document.createElement('canvas');
          canvas.width = nw;
          canvas.height = nh;
          var ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, nw, nh);
          ctx.drawImage(img, 0, 0, nw, nh);
          var out = canvas.toDataURL('image/jpeg', quality||0.8);
          resolve(out && out.length < dataUrl.length ? out : dataUrl);
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = function(){ resolve(dataUrl); };
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
async function _uploadProductPhoto(productId, dataUrl){
  try{
    if(!window.firebase || typeof firebase.storage !== 'function') return null;
    if(!fbAuth || !fbAuth.currentUser) return null;
    if(!/^data:image\//i.test(dataUrl)) return null;
    var compressed = await _compressImage(dataUrl, 1280, 0.8);
    var path = 'shops/' + FB_SHOP_ID + '/products/' + productId + '/' + Date.now() + '_' + Math.floor(Math.random()*1e6) + '.jpg';
    var ref = firebase.storage().ref(path);
    await ref.putString(compressed, 'data_url');
    var url = await ref.getDownloadURL();
    return url || null;
  }catch(e){ try{ console.warn('[photo upload]', e); }catch(_){} return null; }
}
async function _deleteStoragePhotoByUrl(url){
  try{
    if(!url || !/^https?:\/\//i.test(url)) return false;
    if(!window.firebase || typeof firebase.storage !== 'function') return false;
    var ref = firebase.storage().refFromURL(url);
    await ref.delete();
    return true;
  }catch(e){ return false; }
}
async function saveProductPhotos(productId, photos){
  var arr = Array.isArray(photos) ? photos.filter(function(x){ return typeof x === 'string' && x.length > 0; }) : [];
  var urls = [];
  for(var i=0; i<arr.length; i++){
    var src = arr[i];
    if(/^https?:\/\//i.test(src)){ urls.push(src); continue; }
    var url = await _uploadProductPhoto(productId, src);
    if(url) urls.push(url);
  }
  return urls;
}

}

function generateUniqueSKU(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let sku='';
  do{
    let random='';
    if(window.crypto && typeof window.crypto.getRandomValues==='function'){
      const bytes=new Uint8Array(10);
      window.crypto.getRandomValues(bytes);
      random=Array.from(bytes,b=>chars[b%chars.length]).join('');
    }else{
      random=Array.from({length:10},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
    }
    sku='ART-'+random;
  }while(products.some(p=>String(p.sku||'').trim().toLowerCase()===sku.toLowerCase()));
  return sku;
}

function shiftCashSummary(sh){
  const related=orders.filter(o=>o.shiftId===sh.id);
  const paid=related.filter(o=>o.status!=='Возврат');
  const returns=related.filter(o=>Array.isArray(o.returns)&&o.returns.length);
  const cash=paid.reduce((a,o)=>{
    if(Array.isArray(o.paymentSplits)&&o.paymentSplits.length) return a+o.paymentSplits.filter(sp=>(sp.method||'cash')==='cash').reduce((s,sp)=>s+(Number(sp.amount)||0),0);
    return a+(o.paymentMethod==='cash'?(Number(o.total)||0):0);
  },0);
  const returnsCash=returns.reduce((a,o)=>a+(o.returns||[]).filter(r=>(r.method||'cash')==='cash').reduce((s,r)=>s+(Number(r.total)||0),0),0);
  const total=paid.reduce((a,o)=>a+(Number(o.total)||0),0);
  const cashOps=(sh.cashOperations||[]).reduce((s,op)=>s+(op.type==='in'?Number(op.amount)||0:-Number(op.amount)||0),0);
  const expectedCash=Math.max(0,cash-returnsCash+(Number(sh.openingCash)||0)+cashOps);
  return {related,paid,returns,cash,returnsCash,total,expectedCash,count:paid.length,cashOps};
}

  root.innerHTML='<div class="sheet-overlay" id="rm-create-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Новое упоминание</div><button class="sheet-close" id="rm-create-close">✕</button></div><div class="sheet-body"><div class="form-field"><label class="form-label">Текст</label><textarea class="form-input" id="rm-text" rows="4" placeholder="О чём напомнить?"></textarea></div><div class="form-field"><label class="form-label">Дата и время</label><input class="form-input" id="rm-datetime" type="datetime-local" value="'+dt+'"></div></div><div class="sheet-foot"><button class="btn" id="rm-create-cancel">Отмена</button><button class="btn btn-primary" id="rm-create">Создать</button></div></div></div>';
  var close=function(){root.innerHTML='';};
  document.getElementById('rm-create-close').onclick=close;
  document.getElementById('rm-create-cancel').onclick=close;
  document.getElementById('rm-create').onclick=async function(){
    var text=String(document.getElementById('rm-text').value||'').trim();
    var datetime=String(document.getElementById('rm-datetime').value||'').trim();
    if(!text)return showToast('Введите текст');
    if(!datetime)return showToast('Укажите дату и время');
    reminders.push({id:uid(),text:text,datetime:datetime,createdAt:nowISO(),createdBy:activeUser?activeUser.id:null,status:'active',doneAt:null,doneBy:null,comment:''});
    await persist('reminders');
    updateRemindersBadge();
    openRemindersScreen();
  };
}
function openReminderDoneSheet(id){

  var root=document.getElementById('modal-root');
  if(!r||!root)return;
  root.innerHTML='<div class="sheet-overlay" id="rm-done-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Завершить упоминание</div><button class="sheet-close" id="rm-done-close">✕</button></div><div class="sheet-body"><div class="form-hint" style="margin-bottom:10px;">'+escapeHtml(r.text)+'</div><div class="form-field"><label class="form-label">Комментарий</label><textarea class="form-input" id="rm-done-comment" rows="4" placeholder="Комментарий"></textarea></div></div><div class="sheet-foot"><button class="btn" id="rm-done-cancel">Отмена</button><button class="btn btn-primary" id="rm-done">Готово</button></div></div></div>';
  var close=function(){root.innerHTML='';};
  document.getElementById('rm-done-close').onclick=close;
  document.getElementById('rm-done-cancel').onclick=close;

function openRemindersBlocker(list){
  var root=document.getElementById('modal-root');
  if(!root)return;
  root.innerHTML='<div class="sheet-overlay" id="rm-blocker-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Не забудьте</div><button class="sheet-close" id="rm-blocker-close">✕</button></div><div class="sheet-body"><div class="panel">'+list.map(function(r){return '<div class="list-row"><div class="row-icon cat">•</div><div class="row-main"><div class="row-title">'+escapeHtml(r.text)+'</div><div class="row-sub">'+escapeHtml(reminderDateTime(r))+'</div></div></div>';}).join('')+'</div><div class="form-field" style="margin-top:10px;"><label class="form-label">Комментарий</label><textarea class="form-input" id="blocker-comment" rows="4" placeholder="Комментарий"></textarea></div></div><div class="sheet-foot"><button class="btn" id="rm-blocker-cancel">Отмена</button><button class="btn btn-primary" id="rm-blocker-done">Готово</button></div></div></div>';
  var close=function(){root.innerHTML='';};
  document.getElementById('rm-blocker-close').onclick=close;
  document.getElementById('rm-blocker-cancel').onclick=close;
  document.getElementById('rm-blocker-done').onclick=async function(){
    var comment=String(document.getElementById('blocker-comment').value||'').trim();
    if(!comment)return showToast('Введите комментарий');
    list.forEach(function(r){r.status='done';r.doneAt=nowISO();r.doneBy=activeUser?activeUser.id:null;r.comment=comment;});
    await persist('reminders');
    updateRemindersBadge();
    close();
    closeCurrentShift();
  };
}
function openRemindersScreen(){
  var root=document.getElementById('modal-root');
  if(!root)return;
  var active=activeReminders();
  var done=(reminders||[]).filter(function(r){return r&&r.status==='done';}).sort(function(a,b){return String(b.doneAt||'').localeCompare(String(a.doneAt||''));}).slice(0,20);
  root.innerHTML='<div class="sheet-overlay" id="rm-screen-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Упоминания</div><button class="sheet-close" id="rm-screen-close">✕</button></div><div class="sheet-body"><button class="btn btn-primary" id="rm-add" style="width:100%;margin-bottom:12px;">+ Добавить упоминание</button><div class="panel"><div class="panel-head"><div class="panel-title">Активные</div></div>'+ (active.length?active.map(function(r){return '<div class="list-row"><div class="row-icon cat">•</div><div class="row-main"><div class="row-title">'+escapeHtml(r.text)+'</div><div class="row-sub">'+escapeHtml(reminderDateTime(r))+'</div></div><div class="row-right" style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;"><button class="move-action" data-rm-done="'+escapeHtml(r.id)+'">Готово</button><button class="move-action" data-rm-cancel="'+escapeHtml(r.id)+'">Отменить</button></div></div>';}).join(''):'<div class="panel-body"><div class="empty">Активных упоминаний нет</div></div>')+'</div><div class="panel" style="margin-top:10px;"><div class="panel-head"><div class="panel-title">Выполненные</div></div>'+ (done.length?done.map(function(r){return '<div class="list-row"><div class="row-icon cat">✓</div><div class="row-main"><div class="row-title">'+escapeHtml(r.text)+'</div><div class="row-sub">'+escapeHtml(reminderDateTime(r))+' · '+escapeHtml(r.comment||'')+'</div></div></div>';}).join(''):'<div class="panel-body"><div class="empty">Выполненных упоминаний нет</div></div>')+'</div></div><div class="sheet-foot"><button class="btn" id="rm-screen-close-bottom">Закрыть</button></div></div></div>';
  var close=function(){root.innerHTML='';};
  document.getElementById('rm-screen-close').onclick=close;
  document.getElementById('rm-screen-close-bottom').onclick=close;
  document.getElementById('rm-add').onclick=openRemindersCreateSheet;
  document.querySelectorAll('[data-rm-done]').forEach(function(b){b.onclick=function(){openReminderDoneSheet(b.dataset.rmDone);};});
  document.querySelectorAll('[data-rm-cancel]').forEach(function(b){b.onclick=async function(){var r=(reminders||[]).find(function(x){return x&&x.id===b.dataset.rmCancel;});if(!r)return;r.status='cancelled';await persist('reminders');updateRemindersBadge();openRemindersScreen();};});
}

async function closeCurrentShift(){
  var due=dueReminders();
  if(due.length){ openRemindersBlocker(due); return; }
  if(!activeUser||activeUser.role!=='cashier') return;
  const sh=shifts.find(x=>x.id===currentShiftId&&x.status==='open');
  if(!sh){showToast('Открытой смены нет');return;}
  const s=shiftCashSummary(sh);
  const root=document.getElementById('modal-root');
  const limit=Math.max(0,Number(cashSettings.cashDifferenceLimit)||0);
  root.innerHTML=`<div class="sheet-overlay" id="shift-close-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Закрытие смены</div><button class="sheet-close" id="shift-close-x">✕</button></div><div class="sheet-body">
    <div class="info-grid"><div class="info-card"><div class="info-label">Чеков</div><div class="info-value">${s.count}</div></div><div class="info-card"><div class="info-label">Продажи</div><div class="info-value">${fmtMoney(s.total)}</div></div><div class="info-card"><div class="info-label">Наличные</div><div class="info-value">${fmtMoney(s.cash)}</div></div><div class="info-card"><div class="info-label">Возвраты</div><div class="info-value">${fmtMoney(s.returnsCash)}</div></div></div>
    <div class="cash-settings" style="margin-top:10px;"><div class="cash-settings-title">Сверка наличных</div></div>
    <div class="form-field"><label class="form-label">Ожидается в кассе</label><input class="form-input" id="shift-expected" value="${s.expectedCash.toFixed(0)}" readonly></div>
    <div class="form-field"><label class="form-label">Фактически в кассе, ₸</label><input class="form-input" id="shift-actual" type="number" min="0" step="1" placeholder="Введите сумму"></div>
    <div id="shift-diff" class="form-hint" style="min-height:16px;"></div>
    <div class="form-field" style="margin-top:8px;"><label class="form-label">Комментарий</label><input class="form-input" id="shift-note" placeholder="Например: инкассация, расхождение"></div>
  </div><div class="sheet-foot" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;"><button class="btn" id="shift-zrep">📄 Z</button><button class="btn" id="shift-cancel">Отмена</button><button class="btn btn-primary" id="shift-confirm">Закрыть смену</button></div></div></div>`;
  const close=()=>root.innerHTML='';
  document.getElementById('shift-close-x').onclick=close;
  document.getElementById('shift-cancel').onclick=close;
  document.getElementById('shift-zrep').onclick=()=>openZReport(sh.id);
  document.getElementById('shift-close-ov').onclick=e=>{if(e.target.id==='shift-close-ov')close();};
  const actualInput=document.getElementById('shift-actual');
  const diffEl=document.getElementById('shift-diff');
  const recalc=()=>{ const v=actualInput.value.trim(); if(v===''){ diffEl.textContent=''; diffEl.style.color=''; return; } const actual=Number(v)||0; const diff=actual-s.expectedCash; const ok=Math.abs(diff)<=limit; diffEl.textContent=`Расхождение: ${diff>=0?'+':''}${diff.toFixed(0)} ₸${ok?' (в пределах нормы)':' — ВНИМАНИЕ!'}`; diffEl.style.color=ok?'var(--muted)':'var(--danger)'; };
  actualInput.oninput=recalc;
  document.getElementById('shift-confirm').onclick=async()=>{
    const v=actualInput.value.trim();
    if(v===''){ showToast('Укажите фактическую сумму в кассе'); return; }
    const actual=Math.max(0,Number(v)||0); const diff=actual-s.expectedCash; const ok=Math.abs(diff)<=limit;
    if(!ok && !confirm(`Расхождение ${diff.toFixed(0)} ₸ превышает лимит ${limit} ₸. Всё равно закрыть смену?`)) return;
    sh.closedAt=nowISO(); sh.status='closed'; sh.total=s.total; sh.orderCount=s.count;
    sh.expectedCash=s.expectedCash; sh.actualCash=actual; sh.cashDifference=diff; sh.cashDifferenceOk=ok;
    sh.note=document.getElementById('shift-note').value.trim(); sh.closedBy=activeUser.id;
    const sid=sh.id;
    await persist('shifts');
    logSessionEvent('shift_close',{shiftId:sid,total:s.total,count:s.count,cash:actual,diff:diff});
    currentShiftId=null; if(activeSession)activeSession.shiftId=null;
    close(); showToast(`Смена закрыта. Расхождение: ${diff>=0?'+':''}${diff.toFixed(0)} ₸`);
    safeRender(); openMyAccountModal();
  };
}

0jbZT1ekDL5fEzWIqMHCxMat/scKl1P6Ef23C3I7j/jXEpw9C4N1nUKqnCqpytVFP01Qj378KeH/lvwbSv0H4H0TItbVrJ011L56pZ/cYGlYOUoVGWw6MvhLajCpVKXzI8efanzMXaNrHfL0kcC+zF55cX14VWc0fI8N5eu7xNTzV0vhQqjyM5f8AsdcjNGJxnxzi4tafystpWW+S/TrqqT/IezSjD6XDua93QnalSePPtDWz6cnbHQwxeNHL32eXJLlxThYuV4RwdZzVEf8AzGrv39U+alWPILQ+GdN0HJYeU0/T8tkMvhqKMPL4SoSXzH26+SWzPDnq56npTbtGMR0c6MtThOzOjSkur4g3eTk0boLQW6mSmWAra4KRi49wCPnK6Ju5K7AGV43FqWHf0Aky/IKdxiQMre5dxdyewA3JO7Lce3qAdye5bj2gCbsS7h33FuLAEsiaHcC223KLXJWZVATtcNxT9QW4Etye8F84sC7XJxBTYlABDIZuUoA6RUoGxmwH/9k=" alt="On.i CRM"></div><div class="auth-title">On.i CRM</div><div class="auth-sub">Войдите в программу по логину и паролю.</div><div class="form-field"><label class="form-label">Логин</label><input class="form-input" id="auth-login" autocomplete="username" placeholder="Логин"></div><div class="form-field" style="margin-top:10px"><label class="form-label">Пароль</label><input class="form-input" id="auth-password" type="password" autocomplete="current-password" placeholder="Пароль"></div><div id="auth-error" class="auth-error"></div><button class="btn btn-primary btn-block" id="auth-enter" style="margin-top:10px">Войти</button><div class="auth-recovery" id="auth-register">Создать магазин</div><div class="auth-recovery" id="auth-employee">Я сотрудник — ввести код приглашения</div><div class="auth-recovery" id="auth-recovery">Забыли пароль администратора?</div><div class="auth-recovery" id="auth-forgot">Забыли пароль — восстановить по email</div></div></div>`;
  const enter=async()=>{
      const login=document.getElementById('auth-login').value.trim();
      const pass=document.getElementById('auth-password').value;
      const errEl=document.getElementById('auth-error');
      var step=function(){};
      var fail=function(msg){
        if(!errEl) return;
        errEl.style.color='var(--danger)';
        errEl.style.whiteSpace='pre-wrap';
        errEl.style.fontFamily='';
        errEl.style.fontSize='';
        errEl.style.lineHeight='';
        errEl.style.maxHeight='';
        errEl.style.overflow='';
        errEl.textContent=String(msg||'');
      };

      if(!login || !pass){ fail('Введите логин или пароль'); return; }

      // ---- Диагностика окружения ----
      step('ENV:');
      if(window.__ENV_DIAG__){
        window.__ENV_DIAG__.forEach(function(d){ step('  '+d); });
      }
      step('  fbAuth=' + (!!fbAuth));
      step('  currentUser=' + (fbAuth && fbAuth.currentUser ? fbAuth.currentUser.uid : '—'));
      step('  authPersistence=' + (fbAuth && fbAuth._persistence ? fbAuth._persistence.type : '—'));
      step('  authInit=' + (fbAuth && fbAuth._isInitialized));

      var enterBtn=document.getElementById('auth-enter');
      if(enterBtn){ enterBtn.disabled=true; enterBtn.textContent='Проверка…'; }

      // ---- onAuthStateChanged диагностика ----
      var authStateFired=false;
      var authStateVal='—';
      try{
        var unsub=fbAuth.onAuthStateChanged(function(u){
          authStateFired=true;
          authStateVal=u ? ('user '+(u.uid||'').slice(0,8)) : 'null';
          step('onAuthStateChanged: '+authStateVal);
          try{ unsub(); }catch(e){}
        });
        step('onAuthStateChanged подписка установлена');
        setTimeout(function(){
          if(!authStateFired) step('onAuthStateChanged НЕ СРАБОТАЛ за 3с');
        }, 3000);
      }catch(e){ step('onAuthStateChanged throw: '+(e&&e.message||e)); }

      step('1. signIn start');
      var fbResult=null;
      var timedOut=false;
      try{
        var signInPromise=loginViaFirebase(login, pass);
        var timeoutPromise=new Promise(function(_,rej){
          setTimeout(function(){ timedOut=true; rej(new Error('TIMEOUT_15S')); }, 15000);
        });
        fbResult=await Promise.race([signInPromise, timeoutPromise]);
      }catch(e){
        var msg=(e&&e.message)||String(e);
        if(timedOut){
          fail('1a. signIn НЕ ЗАВЕРШИЛСЯ за 15 секунд');
          if(enterBtn){ enterBtn.disabled=false; enterBtn.textContent='Войти'; }
          return;
        }
        step('1b. signIn threw: '+msg);
        fbResult={ok:false, reason:'network', error:msg};
      }
      step('2. signIn result: ok='+(fbResult&&fbResult.ok)+' reason='+(fbResult&&fbResult.reason)+' uid='+((fbResult&&fbResult.uid)||'—'));

      if(enterBtn){ enterBtn.disabled=false; enterBtn.textContent='Войти'; }

      var u=null;
      if(fbResult && fbResult.ok){
        step('3. поиск user');
        u=users.find(x=>x.active!==false && (x.authUid===fbResult.uid || x.login===login));
        if(!u){
          try{
            var _us=await fbDb.collection('users').doc(fbResult.uid).get();
            if(_us && _us.exists){
              var _ud=_us.data()||{};
              var _mo=_ud.memberOf||{};
              var _keys=Object.keys(_mo);
              var _em=_ud.email||'';
              var _login=_em.indexOf('@')>0 ? _em.slice(0,_em.indexOf('@')) : _em;
              var _role=_keys.length>0 ? (_mo[_keys[0]]||'owner') : 'owner';
              users.push({id:fbResult.uid,name:_ud.name||_login||'Владелец',login:_login,email:_em,memberOf:_mo,password:'',role:_role,active:true,authUid:fbResult.uid,authEmail:_em,createdAt:nowISO()});
              try{ await persist('users'); }catch(e){}
              u=users.find(x=>x.authUid===fbResult.uid);
            }
          }catch(e){}
        }
        if(!u){ fail('3a. Аккаунт не найден'); return; }
        step('3b. user.id='+u.id+' role='+u.role);
      } else if(fbResult && fbResult.reason==='bad-credentials'){
        fail('Неверный логин или пароль'); return;
      } else {
        fail('Firebase недоступен: '+(fbResult&&fbResult.reason)+' '+((fbResult&&fbResult.error)||''));
        return;
      }

      step('4. activeUser');
      adminReturnUser=null;
      activeUser={...u};

      step('5. loadUserPrefs');
      try{ loadUserPrefs(activeUser.id); }catch(e){ step('5b loadUserPrefs: '+(e&&e.message||e)); }

      step('6. view');
      currentView=defaultViewFor(u.role);
      if(currentView==='orders')ordersSubView='pos';

      if(u.role==='cashier'){
        step('7. openCashierShift');
        try{ openCashierShift(activeUser); }catch(e){ step('7b: '+(e&&e.message||e)); }
      }

      step('8. switch screens');
      document.getElementById('auth-root').innerHTML='';
      document.getElementById('loading').style.display='none';
      document.getElementById('app').style.display='block';

      step('9. saveAuthSession');
      saveAuthSession();
      logSessionEvent('login');

      step('10. startSessionTimer');
      startSessionTimer();

      step('11. setupRoleMenu');
      setupRoleMenu();

      step('12. safeRender');
      safeRender();

      step('13. saveUiState');
      saveUiState();

      step('DONE');
      setTimeout(function(){
        if(errEl){
          errEl.textContent='';
          errEl.style.color='';
          errEl.style.whiteSpace='';
          errEl.style.fontFamily='';
          errEl.style.fontSize='';
          errEl.style.lineHeight='';
          errEl.style.maxHeight='';
          errEl.style.overflow='';
        }
      }, 2000);
    };
  document.getElementById('auth-enter').onclick=enter;document.getElementById('auth-password').onkeydown=e=>{if(e.key==='Enter')enter()};document.getElementById('auth-login').focus();
  document.getElementById('auth-recovery').onclick=()=>{const code=prompt('Введите код восстановления администратора:');if(code!==ADMIN_RECOVERY_CODE)return showToast('Неверный код восстановления');const a=users.find(x=>x.role==='admin'&&x.login==='admin');const np=prompt('Введите новый пароль администратора:');if(!np||np.length<4)return showToast('Пароль должен быть не короче 4 символов');a.password=np;persist('users').then(()=>showToast('Пароль администратора изменён'));};
  var _fg=document.getElementById('auth-forgot');
  if(_fg)_fg.onclick=async()=>{
    const em=prompt('Введите email, привязанный к аккаунту:');
    if(!em)return;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ showToast('Некорректный email'); return; }
    if(!fbAuth){ showToast('Firebase Auth недоступен'); return; }
    try{
      await fbAuth.sendPasswordResetEmail(em.trim().toLowerCase());
      showToast('Письмо отправлено на '+em+'. Проверьте почту.');
    }catch(e){
      const c=(e&&e.code)||'';
      if(c==='auth/user-not-found'){ showToast('Аккаунт с таким email не найден'); }
      else { showToast('Ошибка: '+((e&&e.message)||e)); }
    }
  };
  document.getElementById('auth-register').onclick=()=>{openRegisterModal();};
  document.getElementById('auth-employee').onclick=()=>{openEmployeeRegisterModal();};
}
function openEmployeeRegisterModal(){
  const root=document.getElementById('modal-root');
  if(!root) return;
  root.innerHTML=`<div class="sheet-overlay" id="emp-ov" style="z-index:300;"><div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Я сотрудник</div><button class="sheet-close" id="emp-close">✕</button></div>
    <div class="sheet-body">
      <div class="form-hint" style="margin-bottom:12px;">Введите код приглашения от владельца магазина. Укажите свой email и пароль.</div>

async function registerAsEmployee(code, email, password){
  if(!fbAuth) return {ok:false, reason:'no-sdk'};
  if(!code || !email || !password) return {ok:false, reason:'empty'};
  if(password.length<6) return {ok:false, reason:'weak'};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return {ok:false, reason:'bad-email'};
  var inviteSnap;
  try{
    inviteSnap = await fbDb.collection('invites').doc(code).get();
  }catch(e){
    return {ok:false, reason:'network', error:e && e.message};
  }
  if(!inviteSnap.exists) return {ok:false, reason:'bad-code'};
  var inv = inviteSnap.data()||{};
  if(inv.used === true) return {ok:false, reason:'used'};
  if(!inv.shopId || !inv.role) return {ok:false, reason:'bad-invite'};
  var emailLower = email.toLowerCase();
  try{
    var cred = await fbAuth.createUserWithEmailAndPassword(emailLower, password);
    var u = cred && cred.user;
    if(!u || !u.uid) return {ok:false, reason:'create-failed'};
    var uid = u.uid;
    var display = emailLower.split('@')[0];
    try{ await u.updateProfile({displayName: display}); }catch(e){}
    var mo = {}; mo[inv.shopId] = inv.role;
    await fbDb.collection('users').doc(uid).set({
      email: emailLower,
      name: display,
      memberOf: mo,
      inviteCode: code
    });
    try{
      await fbDb.collection('invites').doc(code).update({used:true, usedAt: nowISO(), usedBy: uid});
    }catch(e){ console.warn('[invite] mark used failed:', e && e.message); }
    try{ await fbAuth.signOut(); }catch(e){}
    return {ok:true, uid:uid, email:emailLower};
  }catch(err){
    var c = err && err.code || '';
    if(c==='auth/email-already-in-use') return {ok:false, reason:'taken'};
    if(c==='auth/weak-password') return {ok:false, reason:'weak'};
    if(c==='auth/invalid-email') return {ok:false, reason:'bad-email'};
    return {ok:false, reason:'network', error:err && err.message};
  }
}

async function registerNewShop(login, shopName, password){
  if(!fbAuth) return {ok:false, reason:'no-sdk'};
  if(!login || !shopName || !password) return {ok:false, reason:'empty'};
  if(password.length<6) return {ok:false, reason:'weak'};
  var email=String(login).toLowerCase().replace(/[^a-z0-9._-]/g,'')+'@oni.local';
  try{
    var cred=await fbAuth.createUserWithEmailAndPassword(email, password);
    var u=cred && cred.user;
    if(!u || !u.uid) return {ok:false, reason:'create-failed'};
    var uid=u.uid;
    var shopId='shop-'+uid;
    try{ await u.updateProfile({displayName: shopName}); }catch(e){}
    await fbDb.collection('shops').doc(shopId).set({
      name: shopName,
      ownerUid: uid,
      plan: 'free',
      createdAt: nowISO(),
      createdBy: uid
    });
    await fbDb.collection('users').doc(uid).set({
      email: email,
      name: shopName,
      memberOf: { [shopId]: 'owner' }
    });
    try{ await fbAuth.signOut(); }catch(e){}
    return {ok:true, shopId: shopId, email: email};
  }catch(err){
    var code=err && err.code || '';
    if(code==='auth/email-already-in-use') return {ok:false, reason:'taken'};
    if(code==='auth/weak-password') return {ok:false, reason:'weak'};
    if(code==='auth/invalid-email') return {ok:false, reason:'bad-login'};
    return {ok:false, reason:'network', error: err && err.message || String(err)};
  }
}

function unreadMessageCount(){
  if(!activeUser)return 0;
  return messages.filter(m=>{
    const addressed = m.toId===activeUser.id || m.toId==='all';
    return addressed && messageVisibleForMe(m) && m.fromId!==activeUser.id && (!Array.isArray(m.readBy)||!m.readBy.includes(activeUser.id));
  }).length;
}
function alertsList(){
  try{
    const role=(activeUser&&activeUser.role)||'';
    const arr=[];
    if(role==='admin'||role==='manager'){
      const low=products.filter(p=>!p.isCategoryPlaceholder && Number(p.minStock)>0 && Number(p.qty)<=Number(p.minStock));
      if(low.length) arr.push({kind:'low',count:low.length,label:`Мало на складе: ${low.length}`});
      const soonExpiry=products.filter(p=>{ if(!p.expiryDate||p.isCategoryPlaceholder) return false; const d=new Date(p.expiryDate+'T00:00:00'); const days=(d-Date.now())/86400000; return days>=0 && days<=30; });
      if(soonExpiry.length) arr.push({kind:'expiry',count:soonExpiry.length,label:`Истекает срок: ${soonExpiry.length}`});
      if(isModOn('debts')){
        const overdue=debts.filter(d=>d.status!=='paid' && d.remaining>0 && d.dueDate && d.dueDate<todayISO());
        if(overdue.length) arr.push({kind:'debt',count:overdue.length,label:`Просроченных долгов: ${overdue.length}`});
      }
    }
    if((role==='admin'||role==='manager'||role==='storekeeper')&&isModOn('purchases')){
      const pendingReqs=(procurementRequests||[]).filter(r=>r.status==='sent'||r.status==='awaiting');
      if(pendingReqs.length) arr.push({kind:'req',count:pendingReqs.length,label:`Ждут ответа по заявкам: ${pendingReqs.length}`});
    }
    return arr;
  }catch(e){ return []; }
}
function alertsCount(){ return alertsList().reduce((s,x)=>s+Number(x.count||0),0); }

function messageVisibleForMe(m){
  if(!activeUser||!m)return false;
  return !(Array.isArray(m.deletedFor)&&m.deletedFor.includes(activeUser.id));

function chatMessages(chatId){
  const base=chatId==='all' ? messages.filter(m=>m.toId==='all') : messages.filter(m=>(m.toId===chatId&&m.fromId===activeUser?.id)||(m.fromId===chatId&&m.toId===activeUser?.id));
  return base.filter(messageVisibleForMe).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
}
function messageIsIncomingForMe(m){
  return !!activeUser && m.fromId!==activeUser.id && (m.toId===activeUser.id||m.toId==='all');
}
function markChatRead(chatId){
  if(!activeUser)return;
  let changed=false;
  messages.forEach(m=>{
    const belongs=chatId==='all'?m.toId==='all':((m.toId===activeUser.id&&m.fromId===chatId)||(m.fromId===chatId&&m.toId===activeUser.id));
    if(belongs && messageVisibleForMe(m) && m.fromId!==activeUser.id && (m.toId===activeUser.id||m.toId==='all')){
      if(!Array.isArray(m.readBy))m.readBy=[];
      if(!m.readBy.includes(activeUser.id)){m.readBy.push(activeUser.id);changed=true;}
    }
  });
  if(changed){persist('messages').catch(()=>{});updateMessagesBadge();}
}
function chatReadStatus(m){
  if(!activeUser||m.fromId!==activeUser.id)return '';
  const rb=Array.isArray(m.readBy)?m.readBy:[];
  if(m.toId==='all'){
    const recipients=users.filter(u=>u.active!==false&&u.id!==activeUser.id).map(u=>u.id);
    return recipients.length&&recipients.every(id=>rb.includes(id))?'✓✓':'✓';
  }
  return rb.includes(m.toId)?'✓✓':'✓';
}

function getCurrentMenuOrder(){

function applyMenuOrder(){
  var menu=document.getElementById('topbar-menu'); if(!menu)return;
  var order=getCurrentMenuOrder(),movable={}; menu.querySelectorAll('button[id]').forEach(function(b){movable[b.id]=b;});
  var groups=[],current=[];
  Array.prototype.forEach.call(menu.children,function(el){
    if(el.classList&&el.classList.contains('topbar-menu-section')){if(current.length)groups.push(current);current=[];return;}
    if(el.tagName==='BUTTON'&&el.id)current.push(el);
  });
  if(current.length)groups.push(current);
  groups.forEach(function(group){
    var parent=group[0]&&group[0].parentNode; if(!parent)return;
    var ids=group.map(function(b){return b.id;});
    var desired=order.filter(function(id){return ids.indexOf(id)>=0;});
    var boundary=group[group.length-1].nextSibling;

  });

function initMenuReorder(listEl, onCommit){
    let dragEl=null, startY=0, startX=0;
    let holdTimer=null, dragging=false, ghostEl=null;
    let placeholder=null, initialOrder=[];
    const rows=()=>Array.from(listEl.querySelectorAll('[data-menu-id]'));
    const startHold=(el,x,y)=>{
      holdTimer=setTimeout(()=>{
        holdTimer=null; dragging=true; dragEl=el; startX=x; startY=y;
        initialOrder=rows().map(r=>r.dataset.menuId);
        if(navigator.vibrate) try{navigator.vibrate(30);}catch(e){}
        const rect=el.getBoundingClientRect();
        ghostEl=el.cloneNode(true);
        ghostEl.style.cssText='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;pointer-events:none;opacity:.85;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);';
        document.body.appendChild(ghostEl);
        placeholder=document.createElement('div');
        placeholder.style.height=rect.height+'px';
        el.parentNode.insertBefore(placeholder, el);
        el.style.display='none';
      },400);
    };
    const cancelHold=()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} };
    const moveGhost=(x,y)=>{
      if(!ghostEl) return;
      ghostEl.style.transform='translate('+(x-startX)+'px,'+(y-startY)+'px)';
      const elUnder=document.elementFromPoint(x,y);
      if(!elUnder) return;
      const t=elUnder.closest('[data-menu-id]');
      if(!t || t===dragEl || t.parentNode!==listEl) return;
      const tr=t.getBoundingClientRect();
      const midY=tr.top+tr.height/2;
      if(y<midY) listEl.insertBefore(placeholder, t);
      else listEl.insertBefore(placeholder, t.nextSibling);
    };
    const endDrag=()=>{
      if(!dragging) return;
      dragging=false;
      if(ghostEl){ ghostEl.remove(); ghostEl=null; }
      if(placeholder){ listEl.insertBefore(dragEl, placeholder); placeholder.remove(); placeholder=null; }
      dragEl.style.display='';
      const newOrder=rows().map(r=>r.dataset.menuId);
      const changed=newOrder.join(',')!==initialOrder.join(',');
      dragEl=null;
      if(changed && typeof onCommit==='function') onCommit(newOrder);
    };
    listEl.addEventListener('pointerdown',e=>{
      const h=e.target.closest('[data-drag-handle]');
      if(!h) return;
      const el=h.closest('[data-menu-id]');
      if(!el) return;
      e.preventDefault();
      startHold(el, e.clientX, e.clientY);
      el.setPointerCapture(e.pointerId);
    });
    listEl.addEventListener('pointermove',e=>{
      if(holdTimer && Math.abs(e.clientY-startY)>8) cancelHold();
      if(dragging){ e.preventDefault(); moveGhost(e.clientX,e.clientY); }
    });
    listEl.addEventListener('pointerup',()=>{ cancelHold(); if(dragging) endDrag(); });
    listEl.addEventListener('pointercancel',()=>{ cancelHold(); if(dragging) endDrag(); });
  }

  for(var i=0;i<8;i++){ out+=chars.charAt(Math.floor(Math.random()*chars.length)); }

/* ===================== PAGE SLIDER ===================== */
var _psActive=false, _psLocked=false, _psStartX=0, _psStartY=0;

var _psStartTime=0, _psDX=0, _psPrevView=null, _psNextView=null;
var _psPrevEl=null, _psNextEl=null, _psDir=0;

function initPageSlider(){
  const main=document.getElementById('main');
  if(!main) return;

  const EXCLUDE='.chip-row, .frequent-row, .quick-actions-row, .product-photo-swipe, .product-info-scroll, .chat-messages, .menu-order-list, [data-drag-handle], .sheet-overlay, .product-photo-lightbox';

  let prevView=null;
  let nextView=null;

  main.addEventListener('touchstart',e=>{
    if(!activeUser) return;
    if(e.touches.length!==1) return;
    const modal=document.getElementById('modal-root');
    if(modal && modal.innerHTML.trim()) return;
    if(e.target.closest(EXCLUDE)) return;
    if(_psActive) return;

    const t=e.touches[0];
    if(!t) return;

    const nav=roleNav(activeUser.role);
    const idx=nav.indexOf(currentView);
    if(idx<0) return;

    prevView=idx>0 ? nav[idx-1] : null;
    nextView=idx<nav.length-1 ? nav[idx+1] : null;
    if(prevView && !canAccess(prevView)) prevView=null;
    if(nextView && !canAccess(nextView)) nextView=null;

    _psActive=true;
    _psLocked=false;
    _psStartX=t.clientX;
    _psStartY=t.clientY;
    _psStartTime=Date.now();
    _psDX=0;
    _psDir=0;
    _psTargetView=null;
  },{passive:true});

  main.addEventListener('touchmove',e=>{
    if(!_psActive) return;
    if(e.touches.length!==1){
      _psActive=false;
      _psLocked=false;
      _psDir=0;
      _psTargetView=null;
      return;
    }
    const t=e.touches[0];
    if(!t) return;
    const dx=t.clientX-_psStartX;
    const dy=t.clientY-_psStartY;

    if(!_psLocked){
      if(Math.abs(dx)>15 && Math.abs(dx)>Math.abs(dy)){
        const dir=dx<0 ? 1 : -1;
        const target=dir===1 ? nextView : prevView;
        if(!target){
          _psLocked=false;
          _psDir=0;
          _psTargetView=null;
          return;
        }
        _psLocked=true;
        _psDir=dir;
        _psTargetView=target;
      }else if(Math.abs(dy)>15){
        _psActive=false;
        _psLocked=false;
        _psDir=0;
        _psTargetView=null;
        return;
      }else{
        return;
      }
    }

    if(_psLocked){
      e.preventDefault();
      _psDX=dx;
    }
  },{passive:false});

  const finish=()=>{
    if(!_psActive) return;
    const dx=_psDX;
    const dt=Date.now()-_psStartTime;
    const w=window.innerWidth;
    const commit=!!_psTargetView && (Math.abs(dx)>60 && dt<400 || Math.abs(dx)>w*0.3);
    const targetView=_psTargetView;

    _psActive=false;
    _psLocked=false;
    _psDir=0;
    _psTargetView=null;
    prevView=null;
    nextView=null;

    if(!commit || !targetView){
      return;
    }

    main.style.transition='opacity .14s ease-out';
    main.style.opacity='0';

    setTimeout(()=>{
      window.scrollTo(0,0);
      currentView=targetView;
      if(currentView==='orders') ordersSubView='pos';
      main.innerHTML=_psRenderViewHtmlFor(currentView);
      _psBindFor(currentView);
      document.querySelectorAll('.nav-btn').forEach(function(b){
        b.classList.toggle('active',b.dataset.view===currentView);
      });
      const vm=VIEW_META[currentView];
      if(vm){
        document.getElementById('topbar-title').textContent=
          currentView==='orders'
            ? ({pos:'Касса',history:'История чеков',debts:'Долги',consignment:'Под реализацию'}[ordersSubView] || 'Касса')
            : vm.title;
        document.getElementById('topbar-sub').textContent=vm.sub;
      }
      const action=document.getElementById('topbar-action');
      if(action){
        if(currentView==='products'){
          action.style.display='flex';
          action.onclick=function(){ openProductModal(null); };
          action.textContent='+';
        }else if(currentView==='movements'){
          action.style.display='flex';
          action.onclick=openMovementModal;
          action.textContent='+';
        }else{
          action.style.display='none';
          action.onclick=null;
        }
      }
      saveUiState();
      renderCartBar();
      updateMessagesBadge();
      requestAnimationFrame(()=>{
        main.style.transition='opacity .16s ease-in';
        main.style.opacity='1';
        setTimeout(()=>{
          main.style.transition='';
          main.style.opacity='';
        },170);
      });
    },140);
  };

  main.addEventListener('touchend',finish,{passive:true});
  main.addEventListener('touchcancel',()=>{
    _psActive=false;
    _psLocked=false;
    _psDir=0;
    _psTargetView=null;
    prevView=null;
    nextView=null;
  },{passive:true});
}

function _psRenderViewHtmlFor(view){
  var saved=currentView, savedSub=ordersSubView;
  var html='';
  try{
    currentView=view;
    if(view==='orders') ordersSubView='pos';
    if(view==='dashboard') html=viewDashboard();
    else if(view==='products') html=viewProducts();
    else if(view==='movements') html=viewMovements();
    else if(view==='suppliers') html=viewSuppliers();
    else if(view==='orders') html=viewOrders();
    else if(view==='clients') html=viewClients();
  }catch(e){ html=''; }
  finally{ currentView=saved; ordersSubView=savedSub; }
  return html;
}

function _psBindFor(view){
  if(view==='dashboard') bindDashboard();
  else if(view==='products') bindProducts();
  else if(view==='movements') bindMovements();
  else if(view==='suppliers') bindSuppliers();
  else if(view==='orders') bindOrders();
  else if(view==='clients') bindClients();
}

function initSheetSwipeClose(){
  let active=false, locked=false, startX=0, startY=0, dy=0, sheet=null;
  document.addEventListener('touchstart',e=>{
    const head=e.target.closest('.sheet-head, .sheet-handle');
    if(!head) return;
    sheet=head.closest('.sheet');
    if(!sheet) return;
    const t=e.touches[0];
    if(!t) return;
    active=true;locked=false;startX=t.clientX;startY=t.clientY;dy=0;
    sheet.style.transition='none';
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!active||!sheet) return;
    const t=e.touches[0];
    if(!t) return;
    const dx=t.clientX-startX;
    dy=t.clientY-startY;
    if(!locked){
      if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)){active=false;sheet.style.transition='';return;}
      if(Math.abs(dy)>10){
        locked=true;
        if(dy>=0){active=false;sheet.style.transition='';return;}
      }else return;
    }
    if(locked&&dy<0){e.preventDefault();sheet.style.transform='translateY('+dy+'px)';}
  },{passive:false});
  const finish=()=>{
    if(!active||!sheet)return;
    active=false;
    if(dy<-80){
      const overlay=sheet.closest('.sheet-overlay');
      if(overlay) overlay.remove();
      return;
    }
    sheet.style.transition='transform .2s ease-out';
    sheet.style.transform='translateY(0)';
    setTimeout(()=>{if(sheet){sheet.style.transition='';sheet.style.transform='';}},220);
  };
  document.addEventListener('touchend',finish,{passive:true});
  document.addEventListener('touchcancel',()=>{
    if(!active||!sheet)return;
    active=false;
    sheet.style.transition='transform .2s ease-out';
    sheet.style.transform='translateY(0)';
    setTimeout(()=>{if(sheet){sheet.style.transition='';sheet.style.transform='';}},220);
  },{passive:true});
}

function showUndoToast(message,id,seconds=ACTION_UNDO_SECONDS){if(activeUndoToast){clearTimeout(activeUndoToast.timer);activeUndoToast.el.remove();activeUndoToast=null;}const el=document.createElement('div');el.className='undo-toast';const msg=document.createElement('div');msg.className='undo-toast-message';msg.textContent='✓ '+String(message);const actions=document.createElement('div');actions.className='undo-toast-actions';const btn=document.createElement('button');btn.className='undo-toast-button';btn.type='button';let busy=false,deadline=Date.now()+Math.max(1,Number(seconds)||30)*1000;const paint=()=>{btn.textContent=`Отменить (${Math.max(0,Math.ceil((deadline-Date.now())/1000))})`;};paint();btn.onclick=async()=>{if(busy)return;busy=true;btn.disabled=true;confirmBtn.disabled=true;clearTimeout(activeUndoToast?.timer);const ok=await undoAction(id);if(el.parentNode)el.remove();activeUndoToast=null;if(!ok)showToast('Не удалось отменить действие');};const confirmBtn=document.createElement('button');confirmBtn.className='undo-toast-button undo-toast-confirm';confirmBtn.type='button';confirmBtn.textContent='Подтвердить';confirmBtn.onclick=()=>{if(busy)return;clearTimeout(activeUndoToast?.timer);if(el.parentNode)el.remove();activeUndoToast=null;};actions.append(btn,confirmBtn);el.append(msg,actions);document.body.appendChild(el);const tick=()=>{if(!activeUndoToast)return;if(Date.now()>=deadline){el.remove();activeUndoToast=null;return;}paint();activeUndoToast.timer=setTimeout(tick,250);};activeUndoToast={el,timer:setTimeout(tick,250),historyId:id};return el;}
function openActionHistory(){if(!activeUser)return;const root=document.getElementById('modal-root');if(!root)return;let filter='all';const render=()=>{const rows=normalizeActionHistory(actionHistory||[]).slice().reverse().filter(r=>filter==='all'||(filter==='mine'?r.userId===activeUser.id:historyCategory(r.actionType)===filter));const chips=[['all','Все'],['mine','Мои'],['deletes','Удаления'],['settings','Настройки'],['sales','Продажи'],['returns','Возвраты'],['module','Модули'],['shift','Смена']];root.innerHTML=`<div class="sheet-overlay" id="action-history-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">История действий</div><button class="sheet-close" id="action-history-close">✕</button></div><div class="sheet-body"><div class="chip-row" style="display:flex;gap:6px;overflow:auto;margin-bottom:10px;">${chips.map(([k,n])=>`<button type="button" class="chip ${filter===k?'active':''}" data-history-filter="${k}">${n}</button>`).join('')}</div>${rows.length?`<div class="panel">${rows.map(r=>{const u=isUndoAvailable(r)&&HISTORY_HANDLERS[r.actionType]?.undo,rd=r.undone&&HISTORY_HANDLERS[r.actionType]?.redo;return `<div class="list-row"><div class="row-icon ${r.undone?'out':historyCategory(r.actionType)==='sales'?'sale':'cat'}">${r.undone?'↶':r.actionType.includes('delete')?'−':r.actionType.includes('sale')?'₸':'•'}</div><div class="row-main"><div class="row-title">${escapeHtml(r.description)}</div><div class="row-sub">${escapeHtml(r.userName||'Пользователь')} · ${escapeHtml(localDateTime(r.timestamp))}</div><div class="row-sub">${escapeHtml(historyStatus(r))}</div></div><div class="row-right" style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">${u?`<button type="button" class="move-action" data-history-undo="${escapeHtml(r.id)}">Отменить</button>`:''}${rd?`<button type="button" class="move-action" data-history-redo="${escapeHtml(r.id)}">Повторить</button>`:''}<button type="button" class="move-action" data-history-details="${escapeHtml(r.id)}">Детали</button></div></div>`;}).join('')}</div>`:'<div class="empty">История действий пока пуста</div>'}</div></div></div>`;document.getElementById('action-history-close').onclick=()=>root.innerHTML='';document.getElementById('action-history-ov').onclick=e=>{if(e.target.id==='action-history-ov')root.innerHTML='';};document.querySelectorAll('[data-history-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.historyFilter;render();});document.querySelectorAll('[data-history-undo]').forEach(b=>b.onclick=async()=>{b.disabled=true;await undoAction(b.dataset.historyUndo);render();});document.querySelectorAll('[data-history-redo]').forEach(b=>b.onclick=async()=>{b.disabled=true;await redoAction(b.dataset.historyRedo);render();});document.querySelectorAll('[data-history-details]').forEach(b=>b.onclick=()=>{const r=findHistoryRecord(b.dataset.historyDetails);if(r)alert(`${r.description}\n\nБыло:\n${JSON.stringify(r.beforeState,null,2)}\n\nСтало:\n${JSON.stringify(r.afterState,null,2)}`);});};render();}

function _oniPushIdToken(_tries){
  _tries = _tries || 0;
  try{
    if(!fbAuth || !fbAuth.currentUser){
      if(_tries < 6){ setTimeout(function(){ _oniPushIdToken(_tries+1); }, 1500); }
      return;
    }
    fbAuth.currentUser.getIdToken(true).then(function(t){
      if(window.Android && typeof window.Android.setIdToken === 'function'){
        window.Android.setIdToken(t);
      }
    }).catch(function(e){ console.warn('[ai] getIdToken failed', e && e.message); });
  }catch(e){ console.warn('[ai] pushIdToken error', e); }
}
window._oniPushIdToken = _oniPushIdToken;
setInterval(_oniPushIdToken, 25 * 60 * 1000);

// Подписка на авто-обновление Firebase ID-токена.
// Срабатывает при логине, логауте и когда Firebase сам обновляет токен (~раз в час).
try {
  if (window.fbAuth && typeof fbAuth.onIdTokenChanged === 'function') {
    fbAuth.onIdTokenChanged(function(user){
      if (user) {
        user.getIdToken().then(function(t){
          if (window.Android && typeof window.Android.setIdToken === 'function') {
            window.Android.setIdToken(t);
            console.log('[ai] onIdTokenChanged pushed fresh token');
          }
        }).catch(function(e){ console.warn('[ai] token refresh failed', e && e.message); });
      } else {
        if (window.Android && typeof window.Android.setIdToken === 'function') {
          window.Android.setIdToken('');
        }
      }
    });
    console.log('[ai] onIdTokenChanged subscribed');
  } else {
    console.warn('[ai] fbAuth.onIdTokenChanged not available');
  }
} catch(e){ console.warn('[ai] onIdTokenChanged sub error', e && e.message); }

var dashboardFrom=todayISO();
var dashboardTo=todayISO();

function dashboardDateLabel(from,to){
  const f=new Date(from+'T00:00:00'), t=new Date(to+'T00:00:00');
  const fmt=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const wd=d=>d.toLocaleDateString('ru-RU',{weekday:'long'});
  if(from===to) return `${fmt(f)} · ${wd(f)}`;
  return `${fmt(f)} — ${fmt(t)}`;
}
function dashboardPeriod(from,to){
  const mine=orders.filter(o=>o.cashierId===activeUser?.id);
  const list=mine.filter(o=>{const d=String(o.date||'').slice(0,10);return d>=from&&d<=to;});
  const paid=list.filter(o=>o.status!=='Возврат');
  const returns=list.filter(o=>o.status==='Возврат');
  const total=paid.reduce((s,o)=>s+Number(o.total||0),0);
  const qty=paid.reduce((s,o)=>s+(o.items||[]).reduce((a,it)=>a+Number(it.qty||0),0),0);
  return {list,paid,returns,total,qty,checks:paid.length,avg:paid.length?total/paid.length:0};
}

/* Администратору возвращаем прежний дашборд: продажи, склад и движения. */

  const byCategory={};
  products.filter(p=>!p.isCategoryPlaceholder).forEach(p=>{const cat=p.category||'Без категории';byCategory[cat]=(byCategory[cat]||0)+Number(p.qty||0)*Number(p.cost||0);});

      <div class="stat-card"><div class="stat-label">Мало на складе</div><div class="stat-value ${lowStock.length?'warn':''}">${lowStock.length}</div><div class="stat-note">ниже минимума</div></div>
      <div class="stat-card"><div class="stat-label">Продажи, 7 дней</div><div class="stat-value">${fmtMoney(salesWeek)}</div><div class="stat-note">${orders.filter(o=>new Date(o.date)>=weekAgo&&o.status!=='Возврат').length} чек(ов)</div></div>
    </div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Стоимость по категориям</div></div><div class="panel-body">${Object.keys(byCategory).length===0?`<div class="empty">Нет данных</div>`:Object.entries(byCategory).map(([cat,val])=>`<div class="bar-row"><div class="bar-label">${escapeHtml(cat)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,val/maxCat*100)}%"></div></div><div class="bar-val">${fmtMoney(val)}</div></div>`).join('')}</div></div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Требуют пополнения</div></div>${lowStock.length===0?`<div class="panel-body"><div class="empty">Всё в достатке</div></div>`:lowStock.map(p=>`<div class="list-row"><div class="row-icon cat">${initials(p.category)}</div><div class="row-main"><div class="row-title"><span class="${salesTextColor(productSalesQty(p.id))}" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(p.name||'')}</span></div><div class="row-sub">${escapeHtml(p.sku||'')}</div><div class="row-note ${stockTextColor(p)}">Остаток: ${p.qty} ${escapeHtml(p.unit||'')} · минимум ${p.minStock}</div></div><div class="row-right"><span class="badge badge-low">${p.qty} / ${p.minStock} ${escapeHtml(p.unit||'')}</span></div></div>`).join('')}</div>
    <div class="panel"><div class="panel-head"><div class="panel-title">Последние движения</div></div>${recentMoves.length===0?`<div class="panel-body"><div class="empty">Движений пока нет</div></div>`:recentMoves.map(m=>`<div class="list-row"><div class="row-icon ${m.type}">${m.type==='in'?'+':m.type==='out'?'−':'₸'}</div><div class="row-main"><div class="row-title">${escapeHtml(m.productName||'')}</div><div class="row-sub">${fmtDate(m.date)} · ${escapeHtml(m.note||'—')}</div></div><div class="row-right"><div class="row-value ${m.type==='in'?'pos':'neg'}">${m.type==='out'||m.type==='sale'?'−':'+'}${m.qty}</div><div class="move-actions"><button class="move-action delete" data-move-del="${escapeHtml(m.id)}">Удалить</button></div></div></div>`).join('')}</div>

/* Кассиру — только его краткие показатели. Никакой стоимости склада и никакой выписки. */
function viewCashierDashboard(){
  const s=dashboardPeriod(dashboardFrom,dashboardTo);
  const cash=s.paid.filter(o=>o.paymentMethod==='cash').reduce((a,o)=>a+Number(o.total||0),0);
  const kaspi=s.paid.filter(o=>o.paymentMethod==='kaspi'||o.paymentMethod==='red').reduce((a,o)=>a+Number(o.total||0),0);
  const returns=s.returns.reduce((a,o)=>a+Number(o.total||0),0);
  const quick=(label,from,to)=>`<button type="button" class="btn ${dashboardFrom===from&&dashboardTo===to?'btn-primary':''}" data-dash-period="${label}" style="border-radius:999px;padding:7px 11px;font-size:12px;white-space:nowrap;">${label}</button>`;
  return `<div style="padding-bottom:12px;">
    <div style="margin:2px 2px 10px;"><div style="font-size:23px;font-weight:800;letter-spacing:-.4px;">Мой день</div><div style="font-size:12px;color:var(--muted);margin-top:2px;">${dashboardDateLabel(dashboardFrom,dashboardTo)}</div></div>
    <div class="panel" style="border-radius:16px;margin-bottom:10px;"><div class="panel-body" style="padding:10px 12px;"><div style="display:flex;gap:6px;overflow:auto;padding-bottom:2px;">${quick('Сегодня',todayISO(),todayISO())}${(()=>{const d=new Date();d.setDate(d.getDate()-1);const y=d.toISOString().slice(0,10);return quick('Вчера',y,y)})()}${(()=>{const d=new Date();d.setDate(d.getDate()-6);return quick('7 дней',d.toISOString().slice(0,10),todayISO())})()}${(()=>{const d=new Date();const f=new Date(d.getFullYear(),d.getMonth(),1);return quick('Месяц',f.toISOString().slice(0,10),todayISO())})()}</div><div style="display:flex;gap:6px;margin-top:8px;align-items:end;"><input class="form-input" type="date" id="dashboard-from" value="${dashboardFrom}" style="height:36px;font-size:12px;"><input class="form-input" type="date" id="dashboard-to" value="${dashboardTo}" style="height:36px;font-size:12px;"><button type="button" class="btn btn-primary" id="dashboard-apply" style="height:36px;padding:0 10px;font-size:12px;">OK</button></div></div></div>
    <div class="panel" style="border-radius:16px;overflow:hidden;"><div class="panel-body" style="padding:13px;"><div style="font-size:12px;color:var(--muted);">Мои показатели</div><div style="font-size:27px;font-weight:850;letter-spacing:-.6px;margin-top:2px;">${fmtMoney(s.total)}</div><div style="font-size:11px;color:var(--muted);margin-top:2px;">${s.checks} чек(ов) · средний ${fmtMoney(s.avg)}</div><div class="stat-grid" style="margin-top:10px;gap:7px;"><div class="stat-card" style="padding:8px 9px;"><div class="stat-label">Наличные</div><div class="stat-value" style="font-size:15px;">${fmtMoney(cash)}</div></div><div class="stat-card" style="padding:8px 9px;"><div class="stat-label">Kaspi</div><div class="stat-value" style="font-size:15px;">${fmtMoney(kaspi)}</div></div><div class="stat-card" style="padding:8px 9px;"><div class="stat-label">Товаров</div><div class="stat-value" style="font-size:15px;">${s.qty}</div></div><div class="stat-card" style="padding:8px 9px;"><div class="stat-label">Возвраты</div><div class="stat-value" style="font-size:15px;">${fmtMoney(returns)}</div></div></div></div></div>
  </div>`;
}
function viewDashboard(){
  const role=activeUser?.role; var html='';
  if(role==='admin')html=viewAdminDashboard();
  else if(role==='cashier')html=viewCashierDashboard();
  else return '<div class="panel"><div class="panel-body"><div class="empty">Раздел в разработке для вашей роли</div></div></div>';
  var qa=(currentPrefs&&currentPrefs.quickActions)||[]; if(!qa.length)qa=getDefaultQuickActions(activeUser&&activeUser.role);
  var qaHtml=qa.length?'<div class="quick-actions-row">'+qa.map(function(a,i){return '<button class="quick-action-btn" data-qa-idx="'+i+'">'+escapeHtml(a.label)+'</button>';}).join('')+'</div>':'';
  return html.replace(/^(\s*<div[^>]*>)/,function(m){return m+qaHtml;});
}
function bindDashboard(){
  document.querySelectorAll('[data-qa-idx]').forEach(function(b){b.onclick=function(){var idx=Number(b.dataset.qaIdx),qa=(currentPrefs&&currentPrefs.quickActions)||[];if(!qa.length)qa=getDefaultQuickActions(activeUser&&activeUser.role);var a=qa[idx];if(!a)return;if(a.type==='navigate'&&a.view)navigateTo(a.view);else if(a.type==='openModal'&&a.action){var fn=window[a.action];if(typeof fn==='function')fn();}};});
  if(activeUser?.role!=='cashier') return;
  document.querySelectorAll('[data-dash-period]').forEach(b=>b.onclick=()=>{
    const today=todayISO(); let from=today,to=today; const d=new Date();
    if(b.dataset.dashPeriod==='Вчера'){d.setDate(d.getDate()-1);from=to=d.toISOString().slice(0,10);}
    if(b.dataset.dashPeriod==='7 дней'){d.setDate(d.getDate()-6);from=d.toISOString().slice(0,10);}
    if(b.dataset.dashPeriod==='Месяц'){from=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);}
    dashboardFrom=from;dashboardTo=to;safeRender();
  });
  const apply=document.getElementById('dashboard-apply');
  if(apply) apply.onclick=()=>{const f=document.getElementById('dashboard-from')?.value||todayISO();const t=document.getElementById('dashboard-to')?.value||f;if(f>t){showToast('Дата «С» не может быть позже даты «По»');return;}dashboardFrom=f;dashboardTo=t;safeRender();};
}

/* ===================== BARCODES (EAN-13) ===================== */
function ean13Checksum(digits12){
  let sum=0;
  for(let i=0;i<12;i++) sum+=(i%2===0?1:3)*Number(digits12[i]);
  return (10-(sum%10))%10;
}
function ean13GenerateFromSku(sku){
  let seed=0; const s=String(sku||'');
  for(let i=0;i<s.length;i++) seed=(seed*31+s.charCodeAt(i))>>>0;
  const base=String(seed).padStart(9,'0').slice(-9);
  const digits12='200'+base;
  return digits12+ean13Checksum(digits12);
}
function ean13Validate(code){
  const s=String(code||'').trim();
  if(!/^\d{13}$/.test(s)) return false;
  return ean13Checksum(s.slice(0,12))===Number(s[12]);
}
function ean13ToSvg(code,opts={}){
  const s=String(code||'');
  if(!/^\d{13}$/.test(s)) return '';
  const width=opts.width||240; const height=opts.height||80; const showText=opts.showText!==false;
  const L=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'];
  const G=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'];
  const R=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'];
  const first=Number(s[0]);
  const parity=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'][first];
  let bits='101';
  for(let i=1;i<=6;i++){ const d=Number(s[i]); bits+=(parity[i-1]==='L'?L:G)[d]; }
  bits+='01010';
  for(let i=7;i<=12;i++){ const d=Number(s[i]); bits+=R[d]; }
  bits+='101';
  const barWidth=width/bits.length;
  let rects='';
  for(let i=0;i<bits.length;i++){ if(bits[i]==='1'){ rects+=`<rect x="${(i*barWidth).toFixed(2)}" y="0" width="${barWidth.toFixed(2)}" height="${height-(showText?16:0)}" fill="#000"/>`; } }
  const textY=height-2;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}"><rect width="${width}" height="${height}" fill="#fff"/>${rects}${showText?`<text x="${width/2}" y="${textY}" text-anchor="middle" font-family="monospace" font-size="12" fill="#000">${s}</text>`:''}</svg>`;
}

function openMassDeleteConfirm(){
  const root=document.getElementById('modal-root');
  if(!root) return;
  const ids=[...productSelectionSet];
  const n=ids.length;
  if(n===0) return;
  const list=ids.map(id=>products.find(p=>p.id===id)).filter(Boolean);
  root.innerHTML=`<div class="sheet-overlay" id="mass-del-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Удалить товары?</div></div><div class="sheet-body"><div class="form-hint" style="margin-bottom:10px;">Будет удалено: ${n}</div><div class="panel" style="max-height:50vh;overflow:auto;">${list.map(p=>`<div class="list-row"><div class="row-main"><div class="row-title">${escapeHtml(p.name)}</div><div class="row-sub">${escapeHtml(p.sku||'')}</div></div></div>`).join('')}</div></div><div class="sheet-foot" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><button class="btn" id="mass-del-cancel">Отмена</button><button class="btn btn-primary" id="mass-del-confirm">Удалить ${n}</button></div></div></div>`;
  const close=()=>root.innerHTML='';
  document.getElementById('mass-del-cancel').onclick=close;
  document.getElementById('mass-del-ov').onclick=e=>{if(e.target.id==='mass-del-ov')close();};
  document.getElementById('mass-del-confirm').onclick=async()=>{
    const before=products.length;
    for(var ri=0; ri<products.length; ri++){
      if(productSelectionSet.has(products[ri].id)){
        await deleteProductPhotos(products[ri].id);
      }
    }
    try{
      var _rdm = JSON.parse(localStorage.getItem('sklad_crm_recent_deletes') || '{}') || {};
      var _nowm = Date.now();
      productSelectionSet.forEach(function(pid){ _rdm[String(pid)] = _nowm; });
      Object.keys(_rdm).forEach(function(k){ if(_nowm - Number(_rdm[k]) > 86400000) delete _rdm[k]; });
      localStorage.setItem('sklad_crm_recent_deletes', JSON.stringify(_rdm));
    }catch(e){}
    products=products.filter(p=>!productSelectionSet.has(p.id));
    const removed=before-products.length;
    const saved=await persist('products');
    close();
    exitProductSelection();
    showToast(saved===false?`Удалено: ${removed} (проверьте сохранение)`:`Удалено: ${removed}`);
  };
}
