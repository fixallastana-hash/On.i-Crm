function normalizeHeader(value){
  return String(value??'').trim().toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,'');
}
function excelNumber(value, fallback=0){
  if(typeof value==='number' && Number.isFinite(value)) return value;
  const n=Number(String(value??'').replace(/\s/g,'').replace(',','.'));
  return Number.isFinite(n)?n:fallback;
}
function excelText(value, fallback=''){
  const v=String(value??'').trim();
  return v || fallback;
}
function excelDate(value){
  if(!value) return '';
  if(value instanceof Date && !isNaN(value)) return value.toISOString().slice(0,10);
  if(typeof value==='number' && typeof XLSX!=='undefined'){
    const d=XLSX.SSF.parse_date_code(value);
    if(d) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
  }
  const s=String(value).trim();
  const m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return s;
}
function expiryInfo(date){
  if(!date) return {text:'',cls:''};
  const d=new Date(date+'T00:00:00'), now=new Date();
  const days=Math.ceil((d-now)/86400000);
  if(days<0) return {text:`истёк ${fmtDate(date)}`,cls:'expiry-danger'};
  if(days<=30) return {text:`годен до ${fmtDate(date)} · ${days} дн.`,cls:'expiry-warning'};
  return {text:`годен до ${fmtDate(date)}`,cls:''};
}

async function importProductsFromExcel(file){
  if(typeof XLSX==='undefined'){
    showToast('Не удалось загрузить Excel-модуль');
    return;
  }
  try{
    let data;
    if(typeof file==='string'){
      // Нативный Android-выбор передаёт содержимое файла как base64.
      const bin=atob(file);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      data=bytes;
    }else{
      // File.arrayBuffer() отсутствует в некоторых старых WebView — оставляем
      // FileReader как надёжный fallback для браузера.
      data=await new Promise((resolve,reject)=>{
        if(file && typeof file.arrayBuffer==='function'){
          file.arrayBuffer().then(resolve).catch(reject);
        }else{
          const reader=new FileReader();
          reader.onload=()=>resolve(reader.result);
          reader.onerror=()=>reject(reader.error||new Error('file read error'));
          reader.readAsArrayBuffer(file);
        }
      });
    }

    const wb=XLSX.read(data,{type:'array',cellDates:true});
    if(!wb.SheetNames.length) throw new Error('Нет листов');
    const ws=wb.Sheets[wb.SheetNames[0]];

    // Читаем сначала матрицу: так импорт не зависит от пустого SKU,
    // пустых ячеек и особенностей sheet_to_json.
    const matrix=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
    if(!matrix.length){ showToast('Excel-файл пуст'); return; }

    const headerRow=matrix[0].map(v=>String(v??'').trim());
    const normalizedHeaders=headerRow.map(normalizeHeader);
    const colIndex={};
    EXCEL_COLUMNS.forEach(col=>{
      const idx=normalizedHeaders.findIndex(h=>col.aliases.includes(h));
      colIndex[col.key]=idx>=0?idx:-1;
    });

    const required=EXCEL_COLUMNS.find(col=>col.required);
    if(required && colIndex[required.key]<0){
      showToast(`Нужна колонка «${required.header}»`);
      return;
    }

    const get=(row,key)=>{
      const idx=colIndex[key];
      return idx>=0 ? row[idx] : '';
    };

    let added=0, updated=0, skipped=0, merged=0;
    const errorRows=[];
    // Товары, уже встреченные с этим SKU в ТЕКУЩЕМ файле импорта (ключ — SKU в нижнем регистре без пробелов).
    // Нужно, чтобы повторяющийся в Excel SKU не затирал предыдущую строку молча, а суммировал qty.
    const seenInThisImport=new Map();

    // Важное правило: первая строка — заголовки, все следующие — товары.
    for(let i=1;i<matrix.length;i++){
      const r=matrix[i]||[];
      const name=excelText(get(r,'name'));
      if(!name){ skipped++; errorRows.push(i+1); continue; }

      const importedSku=excelText(get(r,'sku'));
      const sku=importedSku || generateUniqueSKU();
      const skuKey=sku.toLowerCase().trim();
      const category=excelText(get(r,'category'),'Без категории');
      const productType=excelText(get(r,'productType'),'piece');
      const description=excelText(get(r,'description'),'');
      const purpose=excelText(get(r,'purpose'),'');
      const unit=excelText(get(r,'unit'),'шт');
      const cost=excelNumber(get(r,'cost'),0);
      const price=excelNumber(get(r,'price'),0);
      const minPrice=excelNumber(get(r,'minPrice'),0);
      const qty=excelNumber(get(r,'qty'),0);
      const reserved=excelNumber(get(r,'reserved'),0);
      const expected=excelNumber(get(r,'expected'),0);
      const minStock=excelNumber(get(r,'minStock'),0);
      const vatRaw=excelText(get(r,'vatRate'),'');
      const vatRate=vatRaw===''?null:excelNumber(vatRaw,0);
      const country=excelText(get(r,'country'),'');
      const weight=excelNumber(get(r,'weight'),0);
      const volume=excelNumber(get(r,'volume'),0);
      const isWeighted=['true','1','да','yes','истина'].includes(String(get(r,'isWeighted')).trim().toLowerCase());
      const supplierSku=excelText(get(r,'supplierSku'),'');
      const archived=['true','1','да','yes','истина'].includes(String(get(r,'archived')).trim().toLowerCase());
      const manufactureDate=excelDate(get(r,'manufactureDate'));
      const expiryDate=excelDate(get(r,'expiryDate'));
      const barcode=excelText(get(r,'barcode'));
      const extraBarcodes=excelText(get(r,'barcodes'),'').split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean);
      const barcodes=[];[barcode,...extraBarcodes].forEach(v=>{if(v&&barcodes.indexOf(v)<0)barcodes.push(v);});
      let packaging=[]; const packagingRaw=excelText(get(r,'packaging'),'');
      if(packagingRaw){try{const parsedPackaging=JSON.parse(packagingRaw);if(Array.isArray(parsedPackaging))packaging=parsedPackaging.filter(x=>x&&typeof x==='object').map(x=>({name:String(x.name||'').trim(),qty:excelNumber(x.qty,0),unit:excelText(x.unit,'шт')})).filter(x=>x.name);}catch(e){packaging=[{name:packagingRaw,qty:1,unit:'шт'}];}}

      // SKU уже встречался в ЭТОМ файле импорта — не создаём вторую запись и не затираем
      // первую, а суммируем остаток и подтягиваем первые непустые фото/описание/категорию.
      const dupe=importedSku ? seenInThisImport.get(skuKey) : null;
      if(dupe){
        dupe.qty=(Number(dupe.qty)||0)+qty;
        if(!dupe.description && description) dupe.description=description;
        if(!dupe.purpose && purpose) dupe.purpose=purpose;
        if((!dupe.category||dupe.category==='Без категории') && category && category!=='Без категории') dupe.category=category;
        if(!dupe.barcode && barcode) dupe.barcode=barcode;
        if(!Array.isArray(dupe.barcodes)) dupe.barcodes=[];
        barcodes.forEach(v=>{if(dupe.barcodes.indexOf(v)<0)dupe.barcodes.push(v);});
        merged++;
        continue;
      }

      // Если SKU указан — обновляем существующий товар. Если SKU пуст —
      // создаём новый с автоматически сгенерированным уникальным артикулом.
      const existing=importedSku
        ? products.find(p=>String(p.sku||'').trim().toLowerCase()===skuKey)
        : null;

      if(existing){
        Object.assign(existing,{sku,name,category,productType,description,purpose,unit,cost,price,minPrice,qty,reserved,expected,minStock,vatRate,country,weight,volume,isWeighted,supplierSku,archived,manufactureDate,expiryDate,barcode,barcodes,packaging});
        existing.updatedAt=nowISO();
        updated++;
        if(importedSku) seenInThisImport.set(skuKey,existing);
      }else{
        const newProduct={id:uid(),sku,name,category,productType,description,purpose,unit,cost,price,minPrice,qty,reserved,expected,minStock,vatRate,country,weight,volume,isWeighted,supplierSku,archived,manufactureDate,expiryDate,barcode,barcodes,packaging,photo:'',photos:[],mainPhoto:'',originalName:name,keywords:[],createdAt:nowISO(),updatedAt:nowISO()};
        try{ window.__oniNewProductId = newProduct.id; }catch(e){}
      products.push(newProduct);
        added++;
        if(importedSku) seenInThisImport.set(skuKey,newProduct);
      }
    }

    if(added===0 && updated===0){
      showToast(`Товары не добавлены. Проверьте колонку «Наименование»${skipped?'':' и данные'}`);
      return;
    }

    await persist('products');
    await saveFullBackupNow();
    safeRender();
    const skippedText=skipped?` · пропущено: ${skipped}`:'';
    const mergedText=merged?` · объединено дублей: ${merged}`:'';
    showToast(`Импорт завершён: +${added}, обновлено ${updated}${skippedText}${mergedText}`);
  }catch(err){
    console.error('Excel import error',err);
    showToast(`Ошибка импорта Excel: ${err?.message||'не удалось прочитать файл'}`);
  }
}

function exportProductsToExcel(){
  if(typeof XLSX==='undefined'){showToast('Не удалось загрузить Excel-модуль');return;}
  const rows=products.filter(p=>!p.isCategoryPlaceholder).map(p=>{
    const row={};
    EXCEL_COLUMNS.forEach(col=>{
      let v=p[col.key];
      if(col.key==='barcodes') v=productBarcodes(p).slice(1).join(', ');
      else if(col.key==='packaging') v=Array.isArray(p.packaging)?JSON.stringify(p.packaging):'';
      else if(col.key==='barcode') v=productBarcodes(p)[0]||'';
      else if(col.key==='vatRate' && v==null) v='';
      else if((col.key==='isWeighted'||col.key==='archived') && typeof v==='boolean') v=v?'Да':'Нет';
      row[col.header]=v??(col.default??'');
    });
    return row;
  });
  const ws=XLSX.utils.json_to_sheet(rows,{header:EXCEL_COLUMNS.map(c=>c.header)});
  ws['!cols']=EXCEL_COLUMNS.map(col=>({wch:Math.max(14,Math.min(32,col.header.length+4))}));
  ws['!freeze']='A2';
  if(rows.length) ws['!autofilter']={ref:`A1:${XLSX.utils.encode_col(EXCEL_COLUMNS.length-1)}${rows.length+1}`};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Товары');
  const base64=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
  if(window.Android&&typeof window.Android.saveExcelTemplate==='function'){window.Android.saveExcelTemplate(base64,'On-i-CRM-Товары.xlsx');return;}
  XLSX.writeFile(wb,'On-i-CRM-Товары.xlsx');
}

    else if(col.key==='packaging') row[col.header]='';
    else if(col.key==='barcode') row[col.header]='2001234567890';
  });
  const ws=XLSX.utils.json_to_sheet([row]);
  // Всегда формируем заголовки напрямую из EXCEL_COLUMNS — это гарантирует,
  // что шаблон и импорт не расходятся после будущих изменений схемы.
  XLSX.utils.sheet_add_aoa(ws,[EXCEL_COLUMNS.map(col=>col.header)],{origin:'A1'});
  ws['!cols']=EXCEL_COLUMNS.map(col=>({wch:Math.max(16,Math.min(34,col.header.length+4))}));
  ws['!freeze']='A2';
  ws['!autofilter']={ref:`A1:${XLSX.utils.encode_col(EXCEL_COLUMNS.length-1)}2`};

  const instructionRows=[
    ['Шаблон импорта товаров — On.i CRM'],
    ['Заполняйте лист «Товары». Колонки формируются автоматически из текущей схемы импорта CRM.'],
    ['Обязательное поле', EXCEL_COLUMNS.filter(col=>col.required).map(col=>col.header).join(', ') || 'нет'],
    ['Необязательное поле «Артикул»', 'Можно оставить пустым — это поле необязательное. CRM не требует артикул для импорта.'],
    ['Даты', 'Рекомендуемый формат: YYYY-MM-DD'],
    ['Числа', 'Цены, остатки и минимальный остаток указывайте числами без валютных символов.'],
    [],
    ['Текущие колонки', ...EXCEL_COLUMNS.map(col=>col.header)]
  ];
  const info=XLSX.utils.aoa_to_sheet(instructionRows);
  info['!cols']=[{wch:30},{wch:62}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Товары');
  XLSX.utils.book_append_sheet(wb,info,'Инструкция');
  // На Android XLSX.writeFile() в WebView не всегда умеет сохранить файл.
  // Поэтому передаём готовый XLSX нативному Android через системное «Сохранить как».
  if(window.Android && typeof window.Android.saveExcelTemplate==='function'){
    const base64=XLSX.write(wb,{bookType:'xlsx',type:'base64'});
    window.Android.saveExcelTemplate(base64,'On-i-CRM-Шаблон.xlsx');
    return;
  }
  XLSX.writeFile(wb,'On-i-CRM-Шаблон.xlsx');
}

// Ответы нативного Android-моста для Excel.

function buildProductDescriptionFromLookup(data){
  const category=String(data.category||'Товар');
  const subtype=String(data.subtype||'').trim();
  const results=Array.isArray(data.results)?data.results:[];
  const f=data.fragrantica||{};
  const texts=results.map(r=>String(r.snippetRu||r.snippet||'')).filter(v=>v&&v.length>8);
  const titles=results.map(r=>String(r.titleRu||r.title||'')).filter(Boolean);
  const all=[...titles,...texts].join(' ');
  const firstMatch=(re)=>{const m=all.match(re);return m?m[1].trim():'';};
  const clean=s=>String(s||'').replace(/\s+/g,' ').replace(/^[,;:. -]+|[,;:. -]+$/g,'').trim();
  const useful=v=>{v=clean(v); if(!v||v.length<2)return ''; if(/^(отзыв|review|reviews|читать отзывы|read reviews)$/i.test(v))return ''; return v;};
  const line=(emoji,label,value)=>{value=useful(value);return value?`${emoji} ${label}: ${value}`:'';};
  const out=[];
  if(category==='Парфюм'){
    let gender=clean(f.gender||'');
    gender=/unisex|унисекс|men and women|мужчин и женщин/i.test(gender)?'унисекс':/women|женщин/i.test(gender)?'женский':/men|мужчин/i.test(gender)?'мужской':'';
    const notes=clean([f.topNotes,f.middleNotes,f.baseNotes].filter(Boolean).map((v,i)=>`${['Верхние','Средние','Базовые'][i]}: ${v}`).join('; '));
    const year=clean(f.year||'');
    // Для парфюма не используем произвольный текст выдачи как «парфюмера».
    // Парфюмер, которого нет в структурированных данных, вообще не выводим.
    const longevity=firstMatch(/(?:longevity|lasting power|lasting|стойкость|стойкость\s+аромата|tenue|kalıcılık)\s*(?:[:\-–—]|=)?\s*([^.!?]{2,100})/i);
    const sillage=firstMatch(/(?:sillage|шлейф|projection|проекция|silaj)\s*(?:[:\-–—]|=)?\s*([^.!?]{2,100})/i);
    const seasons={
      'Весна':firstMatch(/(?:весна|spring)\s*(?:[:\-–—]|=)?\s*(★{1,5}|[1-5]\s*(?:из|\/)\s*5|[^.!?]{1,40})/i),
      'Лето':firstMatch(/(?:лето|summer)\s*(?:[:\-–—]|=)?\s*(★{1,5}|[1-5]\s*(?:из|\/)\s*5|[^.!?]{1,40})/i),
      'Осень':firstMatch(/(?:осень|autumn|fall)\s*(?:[:\-–—]|=)?\s*(★{1,5}|[1-5]\s*(?:из|\/)\s*5|[^.!?]{1,40})/i),
      'Зима':firstMatch(/(?:зима|winter)\s*(?:[:\-–—]|=)?\s*(★{1,5}|[1-5]\s*(?:из|\/)\s*5|[^.!?]{1,40})/i)
    };
    out.push(line('🌸','Тип',gender?`${gender} парфюм`:'парфюм'));
    out.push(line('👃','Ноты',notes));
    out.push(line('📅','Год выпуска',year));
    out.push(line('☀️','Весна',seasons['Весна']));
    out.push(line('🌸','Лето',seasons['Лето']));
    out.push(line('🍂','Осень',seasons['Осень']));
    out.push(line('❄️','Зима',seasons['Зима']));
    out.push(line('⏱','Стойкость',longevity));
    out.push(line('💨','Шлейф',sillage));
  } else if(category==='БАД / витамины'){
    out.push(line('💊','Тип',subtype||'БАД / витамин / комплекс'));
    out.push(line('🎯','Для чего',firstMatch(/(?:benefits?|для чего|польза|supports?|поддерживает)\s*(?:[:\-–—]\s*)?([^.!?]{10,220})/i)));
    out.push(line('✨','Основные свойства',firstMatch(/(?:ingredients?|состав|properties|свойства)\s*(?:[:\-–—]\s*)?([^.!?]{10,220})/i)));
    out.push(line('🥄','Как принимать',firstMatch(/(?:how to take|directions|дозировк[аи]|как принимать|принимать|serving)\s*(?:[:\-–—]\s*)?([^.!?]{5,180})/i)));
    out.push(line('📅','Курс',firstMatch(/(?:course|курс)\s*(?:[:\-–—]\s*)?([^.!?]{3,120})/i)));
    out.push(line('⚠️','Важно',firstMatch(/(?:contraindications?|warnings?|противопоказани[яй]|предупреждени[ея])\s*(?:[:\-–—]\s*)?([^.!?]{5,220})/i)));
  } else if(category==='Книга'){
    out.push(line('📚','Жанр',firstMatch(/(?:genre|жанр)\s*(?:[:\-–—]\s*)?([^.!?]{2,100})/i)));
    out.push(line('✍️','Автор',firstMatch(/(?:author|автор|by)\s*(?:[:\-–—]\s*)?([^.!?,]{2,100})/i)));
    out.push(line('📖','О чём',firstMatch(/(?:about|synopsis|summary|о чем|о чём|содержание|сюжет)\s*(?:[:\-–—]\s*)?([^.!?]{15,260})/i)));
    out.push(line('💡','Главная тема',firstMatch(/(?:theme|main theme|главная тема)\s*(?:[:\-–—]\s*)?([^.!?]{10,180})/i)));
  } else if(category==='Косметика'){
    const kind=subtype||(/\b(шампунь|shampoo)\b/i.test(all)?'шампунь':/\b(зубн(?:ая|ую)\s+паста|toothpaste)\b/i.test(all)?'зубная паста':/\b(миноксидил|minoxidil)\b/i.test(all)?'средство для роста волос':'косметическое средство');
    out.push(line('💧','Тип',kind));
    out.push(line('🎯','Для чего',firstMatch(/(?:for|benefits?|назначение|для чего|для)\s*(?:[:\-–—]\s*)?([^.!?]{10,180})/i)));
    out.push(line('✨','Эффект',firstMatch(/(?:effect|benefits?|эффект|действие|action)\s*(?:[:\-–—]\s*)?([^.!?]{10,180})/i)));
    out.push(line('🧴','Как применять',firstMatch(/(?:how to use|directions|application|как применять|применение)\s*(?:[:\-–—]\s*)?([^.!?]{5,200})/i)));
    out.push(line('⚠️','Важно',firstMatch(/(?:contraindications?|warnings?|противопоказани[яй]|предупреждени[ея])\s*(?:[:\-–—]\s*)?([^.!?]{5,220})/i)));
  } else if(category==='Электроника'){
    out.push(line('⚙️','Характеристики',firstMatch(/(?:specifications?|характеристики)\s*(?:[:\-–—]\s*)?([^.!?]{10,260})/i)));
    out.push(line('🔋','Питание / батарея',firstMatch(/(?:battery|батаре[яи]|аккумулятор)\s*(?:[:\-–—]\s*)?([^.!?]{5,180})/i)));
  } else {
    out.push(line('📝','Описание',texts.slice(0,2).join(' ')));
  }
  return out.filter(Boolean).join('\n');
}

// Оригинал пользовательского фото читается без изменения; для каталога сохраняем уменьшенную JPEG-копию.
// Временные производные для AI/OCR создаются отдельно. PNG/GIF с прозрачностью при сохранении могут стать непрозрачными — это допустимо для фото товара.
async function readOriginalProductImage(file){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>resolve('');r.readAsDataURL(file);});}
async function readResizedProductImage(file,maxSide=1200,quality=0.82){
  const dataUrl=await readOriginalProductImage(file);
  if(!dataUrl)return '';
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(w>maxSide||h>maxSide){
          if(w>=h){h=Math.round(h*maxSide/w);w=maxSide;}else{w=Math.round(w*maxSide/h);h=maxSide;}
        }
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        if(!ctx){resolve(dataUrl);return;}
        ctx.drawImage(img,0,0,w,h);
        const out=canvas.toDataURL('image/jpeg',quality);
        resolve(out&&out.length<dataUrl.length?out:dataUrl);
      }catch(e){resolve(dataUrl);}
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

async function deleteMovement(id){
  if(!requireAccess('movements')) return;
  const m=movements.find(x=>x.id===id);
  if(!m)return;
  if(!confirm(`Удалить движение «${m.productName}» (${m.type==='in'?'+':'−'}${m.qty})? Остаток товара будет пересчитан.`))return;
  const p=products.find(x=>x.id===m.productId);
  if(p){
    var whId=m.warehouseId||'wh-default';
    var st={...(p.stock||{})};
    if(m.type==='in') st[whId]=Math.max(0,(Number(st[whId])||0)-m.qty);
    else if(m.type==='out') st[whId]=(Number(st[whId])||0)+m.qty;
    else if(m.type==='sale') st[whId]=(Number(st[whId])||0)+m.qty;
    else if(m.type==='return') st[whId]=Math.max(0,(Number(st[whId])||0)-m.qty);
    else if(m.type==='inventory'){ if(m.diffSign==='+') st[whId]=(Number(st[whId])||0)+m.qty; else if(m.diffSign==='-') st[whId]=Math.max(0,(Number(st[whId])||0)-m.qty); }
    else if(m.type==='transfer'){ st[whId]=(Number(st[whId])||0)+m.qty; var _toWh=m.toWarehouseId||'wh-default'; st[_toWh]=Math.max(0,(Number(st[_toWh])||0)-m.qty); }
    p.stock=st;
    p.qty=Object.keys(st).reduce(function(s,k){return s+(Number(st[k])||0);},0);
    p.updatedAt=nowISO();
  }
  movements=movements.filter(x=>x.id!==id);
  try{
    var _rdM = JSON.parse(localStorage.getItem('sklad_crm_recent_deletes') || '{}') || {};
    _rdM[String(id)] = Date.now();
    var _nowM = Date.now();
    Object.keys(_rdM).forEach(function(k){ if(_nowM - Number(_rdM[k]) > 86400000) delete _rdM[k]; });
    localStorage.setItem('sklad_crm_recent_deletes', JSON.stringify(_rdM));
    if(fbDb && fbAuth && fbAuth.currentUser){
      var _safeMid = String(id).replace(/[\/\s]+/g, '_');
      await fbDb.collection('shops').doc(FB_SHOP_ID).collection('movementTombstones').doc(_safeMid).set({
        id: String(id),
        deletedAt: Date.now(),
        byUser: (activeUser && activeUser.id) || null
      });
      await fbDb.collection('shops').doc(FB_SHOP_ID).collection('movements').doc(_safeMid).delete();
    }
  }catch(e){}
  await Promise.all([persist('products'),persist('movements')]);
  safeRender();updateMessagesBadge();showToast('Движение удалено');
}

function getFrequentProductCounts(){
  const counts={};
  orders.forEach(o=>{
    (o.items||[]).forEach(it=>{
      const returned=(o.returns||[]).reduce((sum,r)=>sum+((r.items||[]).filter(x=>x.productId===it.productId).reduce((a,x)=>a+(Number(x.qty)||0),0)),0);
      counts[it.productId]=(counts[it.productId]||0)+Math.max(0,(Number(it.qty)||0)-returned);
    });
  });
  return counts;
}
function getFrequentProducts(realProducts){
  const counts=getFrequentProductCounts();
  return [...realProducts].filter(p=>(counts[p.id]||0)>0).sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0) || String(a.name||'').localeCompare(String(b.name||''),'ru',{sensitivity:'base'}));
}
function getUserFavorites(){
  if(!currentPrefs || typeof currentPrefs!=='object')currentPrefs={};
  if(!currentPrefs.favorites || typeof currentPrefs.favorites!=='object')currentPrefs.favorites={frequent:[],problematic:[]};
  if(!Array.isArray(currentPrefs.favorites.frequent))currentPrefs.favorites.frequent=[];
  if(!Array.isArray(currentPrefs.favorites.problematic))currentPrefs.favorites.problematic=[];
  return currentPrefs.favorites;
}
function isFrequent(productId){ return getUserFavorites().frequent.indexOf(productId)>=0; }
function isProblematic(productId){ return getUserFavorites().problematic.indexOf(productId)>=0; }
async function toggleFrequent(productId){
  var f=getUserFavorites();
  var i=f.frequent.indexOf(productId);
  if(i>=0){ f.frequent.splice(i,1); }
  else{
    if(f.frequent.length>=6){ showToast('Максимум 6 частых товаров'); return false; }
    f.frequent.push(productId);
  }
  currentPrefs.favorites=f;
  if(activeUser)userPreferences[activeUser.id]=currentPrefs;
  var ok=await persist('userPreferences');
  safeRender();
  return ok;
}
async function toggleProblematic(productId){
  var f=getUserFavorites();
  var i=f.problematic.indexOf(productId);
  if(i>=0)f.problematic.splice(i,1); else f.problematic.push(productId);
  currentPrefs.favorites=f;
  if(activeUser)userPreferences[activeUser.id]=currentPrefs;
  var ok=await persist('userPreferences');
  safeRender();

}

  paid.forEach(o=>{ if(Array.isArray(o.paymentSplits)&&o.paymentSplits.length){ o.paymentSplits.forEach(sp=>{ const m=sp.method||'cash'; byMethod[m]=(byMethod[m]||0)+Number(sp.amount||0); }); } else { const m=o.paymentMethod||'cash'; byMethod[m]=(byMethod[m]||0)+Number(o.total||0); } }); returns.forEach(o=>{ (o.returns||[]).forEach(r=>{ const m=r.method||'cash'; byMethod[m]=(byMethod[m]||0)-Number(r.total||0); }); });
  const total = paid.reduce((s,o)=>s+Number(o.total||0),0);
  const returnsTotal = returns.reduce((s,o)=>s+(o.returns||[]).reduce((a,r)=>a+Number(r.total||0),0),0);

  const root = document.getElementById('modal-root');
  const methodRows = Object.entries(byMethod).map(([m,t])=>`<div class="calc-row"><span>${escapeHtml(paymentLabel(m))}</span><strong>${fmtMoney(t)}</strong></div>`).join('') || '<div class="form-hint">Продаж нет</div>';
  root.innerHTML=`<div class="sheet-overlay" id="zrep-ov"><div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Z-отчёт · ${localDateTime(sh.openedAt)}</div><button class="sheet-close" id="zrep-close">✕</button></div>
    <div class="sheet-body">

        <div class="info-card"><div class="info-label">Чеков</div><div class="info-value">${data.count}</div></div>
        <div class="info-card"><div class="info-label">Средний чек</div><div class="info-value">${fmtMoney(data.avg)}</div></div>
        <div class="info-card"><div class="info-label">Товаров</div><div class="info-value">${data.qty}</div></div>
        <div class="info-card"><div class="info-label">Возвратов</div><div class="info-value">${data.returnsCount}</div></div>
      </div>
      <div class="contact-box"><div class="contact-title">Разбивка по оплатам</div>${methodRows}</div>
      <div class="calc-box">
        <div class="calc-row"><span>Выручка</span><strong>${fmtMoney(data.total)}</strong></div>
        <div class="calc-row"><span>Возвраты</span><strong>− ${fmtMoney(data.returnsTotal)}</strong></div>
        <div class="calc-row final"><span>Итого к сдаче</span><strong>${fmtMoney(data.total-data.returnsTotal)}</strong></div>
        <div class="calc-row"><span>Налог</span><strong>${fmtMoney(data.taxTotal)}</strong></div>
        <div class="calc-row"><span>Комиссия</span><strong>${fmtMoney(data.commissionTotal)}</strong></div>
        <div class="calc-row final"><span>Чистыми</span><strong>${fmtMoney(data.netTotal)}</strong></div>
      </div>
      <div class="cash-settings"><div class="cash-settings-title">Наличные</div>
        <div class="calc-row"><span>Ожидается</span><strong>${fmtMoney(data.expectedCash)}</strong></div>
        ${data.actualCash!=null?`<div class="calc-row"><span>Фактически</span><strong>${fmtMoney(data.actualCash)}</strong></div><div class="calc-row"><span>Расхождение</span><strong>${data.cashDiff>=0?'+':''}${fmtMoney(data.cashDiff)}</strong></div>`:''}
      </div>
    </div>
    <div class="sheet-foot" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><button class="btn btn-primary" id="zrep-print">🖨️ Печать</button><button class="btn" id="zrep-done">Готово</button></div></div></div>`;
  const close=()=>root.innerHTML='';
  document.getElementById('zrep-close').onclick=close;
  document.getElementById('zrep-done').onclick=close;
  document.getElementById('zrep-ov').onclick=e=>{if(e.target.id==='zrep-ov')close();};
  document.getElementById('zrep-print').onclick=()=>{
    const html=buildZReportHtml(sh,data);
    try{ if(window.Android && typeof window.Android.printReceipt==='function'){ window.Android.printReceipt(html); return; } }catch(e){}
    const w=window.open('about:blank','_blank'); if(!w){ showToast('Не удалось открыть Z-отчёт'); return; }
    w.document.open(); w.document.write(html); w.document.close();

}

function paymentLabel(m){return ({cash:'Наличные',kaspi:'Карта',red:'Kaspi Red',transfer:'Перевод',gift:'Сертификат',debt:'Кредит'}[m]||m||'—');}

function debtStatus(d){
  if(d.status==='paid'||d.remaining<=0)return 'paid';
  if(d.dueDate&&d.dueDate<todayISO())return 'overdue';
  return 'open';
}

async function payDebt(id){
  if(!requireAccess('orders')) return;
  const d=debts.find(x=>x.id===id);if(!d)return;
  const v=prompt(`Сколько погасить? Остаток: ${fmtMoney(d.remaining)}`,String(d.remaining));if(v===null)return;
  const amount=Math.min(d.remaining,Math.max(0,Number(String(v).replace(',','.'))||0));if(!amount){showToast('Введите сумму больше нуля');return;}
  d.paid=(d.paid||0)+amount;d.remaining=Math.max(0,d.amount-d.paid);d.status=d.remaining<=0?'paid':'open';d.payments=d.payments||[];d.payments.push({id:uid(),date:todayISO(),amount});
  await persist('debts');safeRender();showToast(`Погашено: ${fmtMoney(amount)}`);
}

var reportsState={from:null,to:null,tab:'summary'};
var reportsTurnoverFilter='all';
function reportsDefaultPeriod(){ const d=new Date(); const f=new Date(d.getFullYear(),d.getMonth(),1); return {from:f.toISOString().slice(0,10),to:todayISO()}; }
function reportsFilteredOrders(){ const {from,to}=reportsState; return orders.filter(o=>{ const d=String(o.date||'').slice(0,10); return d>=from&&d<=to; }); }
function statusLabel(s){
  return {dead:'Мёртвый сток',slow:'Медленный',normal:'Норма',fast:'Ходовой'}[s]||'—';
}
function statusLabelShort(s){
  return {dead:'🔴 Мёртвый',slow:'🟡 Медленный',normal:'🟢 Норма',fast:'🔵 Ходовой'}[s]||'—';
}
function statusLabelColor(s){
  return {dead:'var(--danger)',slow:'#B84A00',normal:'var(--primary-dark)',fast:'var(--blue)'}[s]||'var(--muted)';
}
var _turnoverCache=null;
function reportsTurnover(){
  const {from,to}=reportsState;
  const cacheKey=`${from}|${to}|${_dataVersion}`;
  if(_turnoverCache && _turnoverCache.key===cacheKey) return _turnoverCache.rows;
  const fromDate=new Date(from+'T00:00:00');
  const toDate=new Date(to+'T23:59:59');
  const daysInPeriod=Math.max(1, Math.round((toDate-fromDate)/86400000));
  const sold={};
  const lastSale={};
  const periodOrders=orders.filter(o=>o.status!=='Возврат');
  periodOrders.forEach(o=>{
    const d=String(o.date||'').slice(0,10);
    const inPeriod=d>=from && d<=to;
    (o.items||[]).forEach(it=>{
      const pid=it.productId;
      if(!pid) return;
      if(!lastSale[pid] || d>lastSale[pid]) lastSale[pid]=d;
      if(!inPeriod) return;
      if(!sold[pid]) sold[pid]={soldQty:0,revenue:0,cost:0};
      sold[pid].soldQty+=Number(it.qty)||0;
      sold[pid].revenue+=(Number(it.price)||0)*(Number(it.qty)||0);
      sold[pid].cost+=(Number(it.cost)||0)*(Number(it.qty)||0);
    });
  });
  orders.forEach(o=>{
    const d=String(o.date||'').slice(0,10);
    if(d<from || d>to) return;
    (o.returns||[]).forEach(r=>{
      (r.items||[]).forEach(it=>{
        const pid=it.productId;
        if(!pid || !sold[pid]) return;
        sold[pid].soldQty=Math.max(0, sold[pid].soldQty-(Number(it.qty)||0));
        sold[pid].revenue=Math.max(0, sold[pid].revenue-(Number(it.price)||0)*(Number(it.qty)||0));
      });
    });
  });
  const now=Date.now();
  const rows=[];
  products.filter(p=>!p.isCategoryPlaceholder).forEach(p=>{
    const s=sold[p.id]||{soldQty:0,revenue:0,cost:0};
    const currentStock=Number(p.qty)||0;
    const avgStock=currentStock;
    const turnoverRatio=s.soldQty/Math.max(avgStock,1);
    const daysOfStock=s.soldQty>0?Math.round(daysInPeriod/turnoverRatio):Infinity;
    let daysSinceLastSale=Infinity;
    if(lastSale[p.id]) daysSinceLastSale=Math.floor((now-new Date(lastSale[p.id]+'T00:00:00').getTime())/86400000);
    let status;
    if(currentStock<=0) status='dead';
    else if(!isFinite(daysSinceLastSale)) status='dead';
    else if(daysSinceLastSale>60) status='dead';
    else if(daysSinceLastSale>=30) status='slow';
    else if(daysSinceLastSale>=10) status='normal';
    else status='fast';
    rows.push({productId:p.id,name:p.name||'',sku:p.sku||'',category:p.category||'Без категории',soldQty:s.soldQty,revenue:s.revenue,costSold:s.cost,currentStock,avgStock,turnoverRatio,daysOfStock,daysSinceLastSale,unitCost:Number(p.cost)||0,status,abc:null});
  });
  const sorted=[...rows].sort((a,b)=>b.revenue-a.revenue);
  const totalRevenue=sorted.reduce((s,x)=>s+x.revenue,0);
  let acc=0;
  sorted.forEach(x=>{
    if(totalRevenue<=0){x.abc='C';return;}
    acc+=x.revenue;
    const share=acc/totalRevenue;
    if(share<=0.80)x.abc='A';
    else if(share<=0.95)x.abc='B';
    else x.abc='C';
  });
  _turnoverCache={key:cacheKey,rows};
  return rows;
}
function reportsCalc(){ const list=reportsFilteredOrders(); const paid=list.filter(o=>o.status!=='Возврат'); const returns=list.filter(o=>Array.isArray(o.returns)&&o.returns.length); const total=paid.reduce((s,o)=>s+Number(o.total||0),0); const returnsTotal=returns.reduce((s,o)=>s+(o.returns||[]).reduce((a,r)=>a+Number(r.total||0),0),0); const taxTotal=paid.reduce((s,o)=>s+Number(o.taxAmount||0),0); const commissionTotal=paid.reduce((s,o)=>s+Number(o.commissionAmount||0),0); const netTotal=paid.reduce((s,o)=>s+Number(o.netAmount||o.total||0),0); const itemsAll=paid.reduce((acc,o)=>{(o.items||[]).forEach(it=>acc.push({...it,orderId:o.id,date:o.date,paymentMethod:o.paymentMethod}));return acc;},[]); const revenueCost=itemsAll.reduce((s,it)=>s+Number(it.cost||0)*Number(it.qty||0),0); const grossProfit=total-revenueCost; const qty=itemsAll.reduce((s,it)=>s+Number(it.qty||0),0); const checks=paid.length; const avg=checks?total/checks:0; return {list,paid,returns,total,returnsTotal,taxTotal,commissionTotal,netTotal,revenueCost,grossProfit,qty,checks,avg,itemsAll}; }
function reportsByCashier(){ const {paid}=reportsCalc(); const map={}; paid.forEach(o=>{const id=o.cashierId||'unknown';if(!map[id])map[id]={id,name:o.cashierName||'—',total:0,checks:0,qty:0};map[id].total+=Number(o.total||0);map[id].checks+=1;map[id].qty+=(o.items||[]).reduce((a,it)=>a+Number(it.qty||0),0);});return Object.values(map).sort((a,b)=>b.total-a.total); }
function reportsByPayment(){ const {paid,returns}=reportsCalc(); const map={}; paid.forEach(o=>{ if(Array.isArray(o.paymentSplits)&&o.paymentSplits.length){ o.paymentSplits.forEach(sp=>{ const m=sp.method||'cash'; map[m]=(map[m]||0)+Number(sp.amount||0); }); } else { const m=o.paymentMethod||'cash'; map[m]=(map[m]||0)+Number(o.total||0); } }); returns.forEach(o=>{ (o.returns||[]).forEach(r=>{ const m=r.method||'cash'; map[m]=(map[m]||0)-Number(r.total||0); }); }); return Object.entries(map).map(([method,total])=>({method,total})).filter(x=>Math.abs(x.total)>0.000001).sort((a,b)=>b.total-a.total); }

function reportsByCategory(){ const {itemsAll}=reportsCalc(); const map={};itemsAll.forEach(it=>{const p=products.find(x=>x.id===it.productId);const cat=p?.category||'Без категории';if(!map[cat])map[cat]={cat,qty:0,revenue:0,profit:0};map[cat].qty+=Number(it.qty||0);map[cat].revenue+=Number(it.price||0)*Number(it.qty||0);map[cat].profit+=(Number(it.price||0)-Number(it.cost||0))*Number(it.qty||0);});return Object.values(map).sort((a,b)=>b.revenue-a.revenue); }
function reportsByDay(){ const {paid}=reportsCalc(); const map={};paid.forEach(o=>{const d=String(o.date||'').slice(0,10);map[d]=(map[d]||0)+Number(o.total||0);});return Object.entries(map).map(([date,total])=>({date,total})).sort((a,b)=>a.date.localeCompare(b.date)); }

ories'?'active':''}" data-reports-tab="categories">Категории</button><button class="seg-tab ${tab==='turnover'?'active':''}" data-reports-tab="turnover">Оборачиваемость</button></div>${body}</div><div class="sheet-foot" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><button class="btn" id="reports-print">🖨️ Печать</button><button class="btn btn-primary" id="reports-excel">📊 Excel</button></div></div></div>`;const close=()=>root.innerHTML='';document.getElementById('reports-close').onclick=close;document.getElementById('reports-ov').onclick=e=>{if(e.target.id==='reports-ov')close();};const fromEl=document.getElementById('reports-from');const toEl=document.getElementById('reports-to');const applyDates=()=>{const f=fromEl.value||today;const t=toEl.value||today;if(f>t){showToast('Дата «С» не может быть позже даты «По»');return;}reportsState.from=f;reportsState.to=t;reportsRender();};if(fromEl)fromEl.onchange=applyDates;if(toEl)toEl.onchange=applyDates;document.querySelectorAll('[data-reports-period]').forEach(b=>b.onclick=()=>{const label=b.dataset.reportsPeriod;let f=today,t=today;if(label==='Вчера'){f=t=yesterday;}else if(label==='7 дней'){f=weekAgo;}else if(label==='Месяц'){f=monthStart;}else if(label==='Год'){f=yearStart;}reportsState.from=f;reportsState.to=t;reportsRender();});document.querySelectorAll('[data-reports-tab]').forEach(b=>b.onclick=()=>{reportsState.tab=b.dataset.reportsTab;reportsRender();});document.querySelectorAll('[data-turnover-filter]').forEach(b=>b.onclick=()=>{reportsTurnoverFilter=b.dataset.turnoverFilter;reportsRender();});document.getElementById('reports-print').onclick=reportsPrint;document.getElementById('reports-excel').onclick=reportsExportExcel; }

    showToast('Этот раздел — основа системы, его нельзя отключить');
    if(inputEl) inputEl.checked=true;
    return;
  }
  if(!activeUser || activeUser.role!=='admin') return;
  const before=moduleOn(key);
  const next=!!(inputEl&&inputEl.checked);
  if(before===next)return;
  if(!next){
    const check=canDisableModule(key);
    if(!check.ok){
      if(inputEl)inputEl.checked=true;
      alert(check.reason);
      return;
    }
  }
  modulesConfig[key]=next;
  const ok=await persist('modulesConfig');
  if(!ok){
    modulesConfig[key]=before;
    if(inputEl)inputEl.checked=before;
    showToast('Не удалось сохранить модуль');
    return;
  }
  let persisted=false;
  try{ const raw=await storageGet('modulesConfig'); const saved=JSON.parse(raw||'{}'); persisted=!!(saved[key]===next); }catch(e){}
  if(!persisted){
    modulesConfig[key]=before;
    if(inputEl)inputEl.checked=before;
    setupRoleMenu();
    safeRender();
    showToast('Модуль не сохранился. Изменение отменено');
    return;
  }
  setupRoleMenu();
  safeRender();
  logSessionEvent(next?'module_on':'module_off',{module:key,previousValue:before,value:next});
  const historyId=await recordAction('module_toggle','module',key,{value:before},{value:next},`${next?'Включён':'Выключен'} модуль «${moduleTitle(key)}»`,true,{module:key});
  if(historyId) showUndoToast(`Модуль «${moduleTitle(key)}» ${next?'включён':'выключен'}`,historyId,30);
  showToast(next?`Модуль «${moduleTitle(key)}» включён`:`Модуль «${moduleTitle(key)}» выключен`);
}

async function applyPreset(presetKey){
  if(!activeUser||activeUser.role!=='admin') return false;
  const preset=MODULE_PRESETS[presetKey];
  if(!preset) return false;
  const next={};
  Object.keys(defaultModulesConfig).forEach(function(k){
    next[k]=preset.modules&&preset.modules[k]===true;
  });
  for(const key of Object.keys(next)){
    if(modulesConfig[key]===true&&next[key]===false){
      const check=canDisableModule(key);
      if(!check.ok){showToast(check.reason);return false;}
    }
  }
  const before={...modulesConfig};
  modulesConfig=next;
  const ok=await persist('modulesConfig');
  if(!ok){modulesConfig=before;showToast('Не удалось сохранить пресет');return false;}
  try{localStorage.setItem('oni_crm_modules_preset_done','1');}catch(e){}
  setupRoleMenu();safeRender();
  const historyId=await recordAction('module_preset','modules',null,{modulesConfig:before},{modulesConfig:cloneState(next)},`Пресет «${preset.name}» применён`,true,{metadata:{presetKey}});
  if(historyId) showUndoToast(`Пресет «${preset.name}» применён`,historyId,30);
  showToast(`Пресет «${preset.name}» применён`);
  return true;
}

  }else{text=d.description||'';}
  if(desc&&text)desc.value=text;if(purpose&&d.purpose)purpose.value=d.purpose;
  _lookupCategoryAuto=true;_lookupDescriptionAuto=true;
  if(st)st.textContent='ИИ: товар определён. Источники проверены; данные из поисковой выдачи не показываются.';

function openCashSettings(){
  if(activeUser?.role!=='admin') return;
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="sheet-overlay" id="cash-settings-ov"><div class="sheet"><div class="sheet-handle"></div>
    <div class="sheet-head"><div class="sheet-title">Настройки кассы и товаров</div><button class="sheet-close" id="cash-settings-close">✕</button></div>
    <div class="sheet-body">
      <div class="cash-settings">
        <div class="cash-settings-title">Проценты применяются к сумме после скидки</div>
      </div>
      <div class="form-field"><label class="form-label">Налог с выручки, %</label><input class="form-input" id="set-tax" type="number" min="0" max="100" step="0.01" value="${cashSettings.taxRate}"></div>
      <div class="form-field"><label class="form-label">Комиссия Kaspi Pay, %</label><input class="form-input" id="set-kaspi" type="number" min="0" max="100" step="0.01" value="${cashSettings.kaspiPayRate}"></div>
      <div class="form-field"><label class="form-label">Комиссия Kaspi Red, %</label><input class="form-input" id="set-red" type="number" min="0" max="100" step="0.01" value="${cashSettings.kaspiRedRate}"></div>
      <div class="form-field"><label class="form-label">Допустимая разница наличных, ₸</label><input class="form-input" id="set-cash-diff" type="number" min="0" step="1" value="${cashSettings.cashDifferenceLimit??0}"></div>

        <div class="panel-body" style="padding:10px 12px;">
          <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <span style="font-size:13px;font-weight:600;">Блокировка по бездействию</span>
            <input type="checkbox" id="set-session-lock-enabled" ${cashSettings.sessionLockEnabled?'checked':''}>
          </label>
          <div class="form-hint" style="margin-top:6px;color:var(--muted);">Когда выключено — сессия не блокируется и не выходит по таймауту.</div>
        </div>
      </div>
      <div class="form-grid2" id="session-timer-fields">
        <div class="form-field"><label class="form-label">Автолок сессии, мин</label><input class="form-input" id="set-session-lock" type="number" min="0" step="1" value="${cashSettings.sessionLockMinutes??15}"></div>
        <div class="form-field"><label class="form-label">Автовыход, мин</label><input class="form-input" id="set-session-logout" type="number" min="0" step="1" value="${cashSettings.sessionLogoutMinutes??120}"></div>
      </div>
      <div class="form-field"><label class="form-label">Автозакрытие смены, часов</label><input class="form-input" id="set-shift-auto" type="number" min="1" step="1" value="${cashSettings.shiftAutoCloseHours??24}"></div>
      <div class="cash-settings" style="background:#FFF9E5;border-color:#F0E0A8;"><div class="cash-settings-title" style="color:#8B6914;">Бонусная система клиентов</div></div>
      <label style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;"><span style="font-size:13px;font-weight:600;">Включить бонусы</span><input type="checkbox" id="set-bonus-enabled" ${cashSettings.bonusEnabled?'checked':''}></label>
      <div class="form-grid2">
        <div class="form-field"><label class="form-label">% начисления</label><input class="form-input" id="set-bonus-percent" type="number" min="0" max="50" step="0.1" value="${cashSettings.bonusPercent??1}"></div>
        <div class="form-field"><label class="form-label">Макс. оплата бонусами, %</label><input class="form-input" id="set-bonus-maxpay" type="number" min="0" max="100" step="1" value="${cashSettings.bonusMaxPayPercent??50}"></div>
      </div>
      <div class="visual-settings">
        <div class="visual-settings-title">Визуальные индикаторы товаров</div>
        <div class="form-hint" style="margin-bottom:8px;color:var(--muted);">● Продажи: жёлтый / оранжевый / красный. ★ Остаток: жёлтый / красный.</div>
        <div class="visual-settings-grid">
          <div class="form-field"><label class="form-label">Продажи: жёлтый от</label><input class="form-input" id="set-sales-yellow" type="number" min="1" step="1" value="${visualSettings.salesYellow}"></div>
          <div class="form-field"><label class="form-label">Продажи: оранжевый от</label><input class="form-input" id="set-sales-orange" type="number" min="1" step="1" value="${visualSettings.salesOrange}"></div>
          <div class="form-field"><label class="form-label">Продажи: красный от</label><input class="form-input" id="set-sales-red" type="number" min="1" step="1" value="${visualSettings.salesRed}"></div>
          <div class="form-field"><label class="form-label">Остаток: жёлтый до</label><input class="form-input" id="set-stock-yellow" type="number" min="1" step="1" value="${visualSettings.stockYellow}"></div>
          <div class="form-field"><label class="form-label">Остаток: красный до</label><input class="form-input" id="set-stock-red" type="number" min="0" step="1" value="${visualSettings.stockRed}"></div>
        </div>
      </div>
      <div class="form-hint" style="color:var(--muted);">Эти проценты можно менять в любое время. Для каждой продажи сохраняются использованные ставки, поэтому старая история не изменится.</div>
    </div>
    <div class="sheet-foot"><button class="btn btn-primary btn-block" id="save-cash-settings">Сохранить настройки</button></div>
  </div></div>`;
  const close=()=>root.innerHTML='';
  var lockEnabled=document.getElementById('set-session-lock-enabled');
  var timerFields=document.getElementById('session-timer-fields');
  var updateTimerVisibility=function(){
    if(timerFields)timerFields.style.display=(lockEnabled&&lockEnabled.checked)?'':'none';
  };
  if(lockEnabled)lockEnabled.onchange=updateTimerVisibility;
  updateTimerVisibility();
  document.getElementById('cash-settings-close').onclick=close;
  document.getElementById('cash-settings-ov').onclick=e=>{if(e.target.id==='cash-settings-ov')close();};
  document.getElementById('save-cash-settings').onclick=async()=>{
    const clamp=v=>Math.min(100,Math.max(0,Number(v)||0));
    cashSettings.taxRate=clamp(document.getElementById('set-tax').value);
    cashSettings.kaspiPayRate=clamp(document.getElementById('set-kaspi').value);
    cashSettings.kaspiRedRate=clamp(document.getElementById('set-red').value);
    cashSettings.cashDifferenceLimit=Math.max(0,Math.round(Number(document.getElementById('set-cash-diff').value)||0));
    cashSettings.sessionLockEnabled=!!(document.getElementById('set-session-lock-enabled')&&document.getElementById('set-session-lock-enabled').checked);
    cashSettings.sessionLockMinutes=Math.max(0,Math.round(Number(document.getElementById('set-session-lock').value)||0));
    cashSettings.sessionLogoutMinutes=Math.max(cashSettings.sessionLockMinutes,Math.round(Number(document.getElementById('set-session-logout').value)||0));
    cashSettings.shiftAutoCloseHours=Math.max(1,Math.round(Number(document.getElementById('set-shift-auto').value)||1));
    cashSettings.bonusEnabled=!!document.getElementById('set-bonus-enabled').checked;
    cashSettings.bonusPercent=Math.max(0,Math.min(50,Number(document.getElementById('set-bonus-percent').value)||0));
    cashSettings.bonusMaxPayPercent=Math.max(0,Math.min(100,Number(document.getElementById('set-bonus-maxpay').value)||0));
    const positive=v=>Math.max(1,Math.round(Number(v)||1));
    visualSettings.salesYellow=positive(document.getElementById('set-sales-yellow').value);
    visualSettings.salesOrange=Math.max(visualSettings.salesYellow,positive(document.getElementById('set-sales-orange').value));
    visualSettings.salesRed=Math.max(visualSettings.salesOrange,positive(document.getElementById('set-sales-red').value));
    visualSettings.stockRed=Math.max(0,Math.round(Number(document.getElementById('set-stock-red').value)||0));
    visualSettings.stockYellow=Math.max(visualSettings.stockRed+1,Math.round(Number(document.getElementById('set-stock-yellow').value)||1));
    await Promise.all([persist('cashSettings'),persist('visualSettings')]);close();safeRender();showToast('Настройки сохранены');
  };
}

async function softDeleteShop(){
  if(!activeUser || activeUser.role!=='admin'){ showToast('Нет доступа'); return; }
  if(!fbDb || !fbAuth || !fbAuth.currentUser){ showToast('Firebase недоступен'); return; }
  var shopName = shopSettings.name || FB_SHOP_ID;
  if(!confirm('Удалить магазин «'+shopName+'»?\n\nМагазин будет скрыт. Вход для всех сотрудников заблокируется. Данные сохраняются 30 дней.')) return;
  var check = prompt('Для подтверждения введите название магазина:\n'+shopName);
  if(check !== shopName){ if(check!==null) showToast('Название не совпадает — отменено'); return; }
  try{
    await fbDb.collection('shops').doc(FB_SHOP_ID).update({
      deleted: true,
      deletedAt: nowISO(),
      deletedBy: fbAuth.currentUser.uid
    });
  }catch(e){
    showToast('Ошибка: '+((e&&e.message)||e));
    return;
  }
  try{
    var uid=fbAuth.currentUser.uid;
    await fbDb.collection('users').doc(uid).update({ memberOf: {} });
  }catch(e){ console.warn('[soft delete] memberOf clear failed', e && e.message); }
  showToast('Магазин удалён. Доступ закрыт.');
  setTimeout(async function(){
    try{ await fbAuth.signOut(); }catch(e){}
    try{ localStorage.clear(); }catch(e){}
    location.reload();
  }, 1500);
}

/* ===================== RETURNS ===================== */
function getReturnedQty(orderId, productId){
  return movements
    .filter(m=>m.type==='return' && m.orderId===orderId && m.productId===productId)
    .reduce((s,m)=>s+(Number(m.qty)||0),0);
}

function getOrderReturnTotal(order){
  return order.items.reduce((s,it)=>{
    const returned=Math.min(it.qty,getReturnedQty(order.id,it.productId));
    return s+returned*it.price;
  },0);
}

function openReturnModal(order){
  const root=document.getElementById('modal-root');
  const availableItems=(order.items||[]).map((it,index)=>{
    const returned=getReturnedQty(order.id,it.productId);
    const available=Math.max(0,it.qty-returned);
    return {...it,index,returned,available};
  }).filter(it=>it.available>0);

  if(availableItems.length===0){
    showToast('По этому чеку всё уже возвращено');
    return;
  }
  let returnMethod='cash';

  root.innerHTML=`
  <div class="sheet-overlay" id="return-ov">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title">Возврат · ${escapeHtml(order.number||'')}</div>
        <button class="sheet-close" id="return-close">✕</button>
      </div>
      <div class="sheet-body">
        <div class="return-warning">Выберите количество товара для возврата. Возвращённый товар будет снова добавлен на склад.</div>
        <div class="return-items">
          ${availableItems.map(it=>`
            <div class="return-item">
              <div class="return-item-main">
                <div class="return-item-name">${escapeHtml(it.name||'')}</div>
                <div class="return-item-sub">${escapeHtml(it.sku||'')} · доступно ${it.available} ${escapeHtml(products.find(p=>p.id===it.productId)?.unit||'шт')}</div>
              </div>
              <input class="form-input return-qty" type="number" min="0" max="${it.available}" value="0" data-return-qty="${it.index}">
              <div class="return-total">${fmtMoney(0)}</div>
            </div>`).join('')}
        </div>
        <div class="form-field return-reason">
          <label class="form-label">Причина возврата</label>
          <input class="form-input" id="return-reason" placeholder="Брак, клиент передумал…">
        </div>
        <div class="form-field return-reason">
          <label class="form-label">Способ возврата денег</label>
          <div class="pay-toggle" id="return-method-toggle">
            <button type="button" class="pay-btn active" data-return-method="cash">Наличные</button>
            <button type="button" class="pay-btn" data-return-method="kaspi">Kaspi</button>
            <button type="button" class="pay-btn" data-return-method="red">Kaspi Red</button>
            ${isModOn('bonuses') ? '<button type="button" class="pay-btn" data-return-method="bonus">На бонусы</button>' : ''}
            <button type="button" class="pay-btn" data-return-method="gift">На сертификат</button>
            <button type="button" class="pay-btn" data-return-method="exchange">Обмен</button>
          </div>
        </div>
        <div id="return-bonus-note" class="form-hint" style="display:none;color:var(--muted);">Будет начислено бонусов клиенту на сумму возврата</div>
        <div class="total-row">
          <span class="label">К возврату</span>
          <span class="value" id="return-total">${fmtMoney(0)}</span>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn btn-primary btn-block" id="return-save">Оформить возврат</button>
      </div>
    </div>
  </div>`;

  const close=()=>root.innerHTML='';
  document.getElementById('return-close').onclick=close;
  document.getElementById('return-ov').addEventListener('click',e=>{
    if(e.target.id==='return-ov') close();
  });
  document.querySelectorAll('[data-return-method]').forEach(b=>b.onclick=()=>{
    const nextMethod=b.dataset.returnMethod;
    if(nextMethod==='bonus' && !isModOn('bonuses')){ showToast('Модуль «Бонусы» выключен'); return; } if(nextMethod==='bonus' && !order.contactId){ showToast('Для возврата на бонусы нужен клиент в чеке'); return; }
    returnMethod=nextMethod;
    document.querySelectorAll('[data-return-method]').forEach(x=>x.classList.toggle('active',x.dataset.returnMethod===returnMethod));
    const note=document.getElementById('return-bonus-note'); if(note) note.style.display=returnMethod==='bonus'?'block':'none';
  });

  const updateReturnTotal=()=>{
    let total=0;
    availableItems.forEach(it=>{
      const input=document.querySelector(`[data-return-qty="${it.index}"]`);
      const qty=Math.max(0,Math.min(it.available,Number(input?.value)||0));
      if(input && Number(input.value)!==qty) input.value=qty;
      total += qty*it.price;
      const row=input?.closest('.return-item');
      const totalEl=row?.querySelector('.return-total');
      if(totalEl) totalEl.textContent=fmtMoney(qty*it.price);
    });
    const totalEl=document.getElementById('return-total');
    if(totalEl) totalEl.textContent=fmtMoney(total);
    return total;
  };

  document.querySelectorAll('[data-return-qty]').forEach(input=>{
    input.oninput=updateReturnTotal;
  });

  document.getElementById('return-save').onclick=async()=>{
    let total=0;
    const selected=[];

    for(const it of availableItems){
      const input=document.querySelector(`[data-return-qty="${it.index}"]`);
      const qty=Math.max(0,Math.min(it.available,Number(input?.value)||0));
      if(qty>0){
        selected.push({it,qty});
        total += qty*it.price;
      }
    }

    if(selected.length===0){
      showToast('Выберите хотя бы один товар');
      return;
    }

    const reason=(document.getElementById('return-reason')?.value.trim())||'Возврат по чеку';

    if((returnMethod==='kaspi'||returnMethod==='red') && !(window.Android&&typeof window.Android.startKaspiRefund==='function')){
      showToast('Возврат Kaspi доступен только в Android-приложении с поддержкой Smart POS');
      return;
    }

    const returnSnapshot={
      products:JSON.parse(JSON.stringify(products)),
      movements:JSON.parse(JSON.stringify(movements)),
      orders:JSON.parse(JSON.stringify(orders)),
      contacts:JSON.parse(JSON.stringify(contacts)),
      giftCards:JSON.parse(JSON.stringify(giftCards))
    };

    // Проверяем и восстанавливаем остаток товара.
    for(const {it,qty} of selected){
      const p=products.find(x=>x.id===it.productId);
      if(!p){
        showToast(`Товар "${it.name}" не найден`);
        return;
      }
      var _retWhId=(order&&order.warehouseId)||'wh-default';
      var _st={...(p.stock||{})};
      _st[_retWhId]=(Number(_st[_retWhId])||0)+qty;
      p.stock=_st;
      p.qty=Object.keys(_st).reduce(function(s,k){return s+(Number(_st[k])||0);},0);
      p.updatedAt=nowISO();

      movements.push({
        id:uid(),
        productId:p.id,
        productName:p.name,
        productSku:p.sku,
        type:'return',
        qty,
        date:todayISO(),
        note:`Возврат ${order.number}${reason?' · '+reason:''}`,
        orderId:order.id
      });
    }

    // Записываем агрегированную информацию о возврате в чек.
    if(!order.returns) order.returns=[];
    order.returns.push({
      id:uid(),
      date:todayISO(),
      reason,
      total,
      method:returnMethod,
      needsKaspiRefund:returnMethod==='kaspi'||returnMethod==='red',
      items:selected.map(({it,qty})=>({
        productId:it.productId,
        name:it.name,
        sku:it.sku,
        qty,
        price:it.price
      }))
    });

    if(returnMethod==='bonus' && isModOn('bonuses') && order.contactId){
      const c=contacts.find(x=>x.id===order.contactId);
      if(c){
        if(!Array.isArray(c.bonusHistory)) c.bonusHistory=[];
        c.bonusBalance=(Number(c.bonusBalance)||0)+total;
        c.bonusHistory.push({id:uid(),type:'in',amount:total,date:todayISO(),orderId:order.id,note:`Возврат по чеку ${order.number}`});
      }
      await persist('contacts');
    } else if(returnMethod==='gift'){
      const card={id:uid(),code:giftCardCode(),amount:total,used:0,expiresAt:'',owner:order.customer||'',note:`Возврат по чеку ${order.number}`,createdAt:nowISO(),createdBy:activeUser?.id||'',history:[]};
      giftCards.push(card);
      card.history.push({id:uid(),type:'refund',amount:total,date:nowISO(),orderNumber:order.number,byUserId:activeUser?.id||''});
      await persist('giftCards');
      alert(`Сертификат на ${fmtMoney(total)} создан.\nКод: ${card.code}`);
      showToast(`Сертификат ${card.code} выдан`);
    } else if((returnMethod==='kaspi'||returnMethod==='red') && window.Android && typeof window.Android.startKaspiRefund==='function'){
      try{ await window.Android.startKaspiRefund(String(total),String(returnMethod),String(kaspiSettings.host||''),String(kaspiSettings.port||8080),String(kaspiSettings.terminalId||''),String(kaspiSettings.cashierName||'On.i CRM'),String(order.kaspiTransactionId||'')); }catch(e){ showToast('Возврат Kaspi оформлен в CRM, Smart POS не подтвердил операцию'); }
    }

    // Если возвращён весь чек — отмечаем его полностью возвращённым.
    const returnedTotal=getOrderReturnTotal(order);
    if(returnedTotal>=order.total) order.status='Возврат';

    const saveResults=await Promise.all([
      persist('products'),
      persist('movements'),
      persist('orders')
    ]);
    if(saveResults.some(r=>r===false)){
      products=returnSnapshot.products;
      movements=returnSnapshot.movements;
      orders=returnSnapshot.orders;
      contacts=returnSnapshot.contacts;
      giftCards=returnSnapshot.giftCards;
      showToast('Ошибка сохранения возврата. Данные CRM восстановлены.');
      return;
    }

    close();
    safeRender();
    showToast(`Возврат оформлен: ${fmtMoney(total)}`);
  };
}

    const saveDraft=async()=>{ session.items=session.items||{}; root.querySelectorAll('.inv-actual').forEach(el=>{const it=session.items[el.dataset.invId];if(it)it.actualQty=el.value===''?null:Math.max(0,Math.floor(Number(el.value)||0));}); await persist('inventorySessions'); };
    root.querySelectorAll('.inv-actual').forEach(el=>el.onchange=saveDraft);
    const addProduct=p=>{if(!p)return;session.items=session.items||{};if(!session.items[p.id])session.items[p.id]={productId:p.id,name:p.name||'',sku:p.sku||'',bookQty:Number(p.qty)||0,actualQty:null,cost:Number(p.cost)||0};render();};
    const results=document.getElementById('inv-search-results'), search=document.getElementById('inv-search');
    const showResults=()=>{const q=search.value.trim();const list=inventoryProductSearch(q);results.style.display='block';results.innerHTML=list.map(p=>`<button type="button" class="list-row" data-inv-add="${escapeHtml(p.id)}" style="width:100%;text-align:left;background:none;border:0"><div class="row-main"><div class="row-title">${escapeHtml(p.name)}</div><div class="row-sub">${escapeHtml(p.sku||'')} · ${escapeHtml(p.barcode||'')} · остаток ${Number(p.qty)||0}</div></div></button>`).join('')||'<div class="panel-body"><div class="empty">Ничего не найдено</div></div>';results.querySelectorAll('[data-inv-add]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.invAdd);results.style.display='none';addProduct(p);});};
    search.oninput=showResults;
    const scan=()=>{if(window.Android&&typeof window.Android.scanBarcode==='function')window.Android.scanBarcode();else showToast('Сканер недоступен');}; document.getElementById('inv-scan').onclick=scan;
    window.onBarcodeScanned=function(json){try{const d=typeof json==='string'?JSON.parse(json):json;const code=String(d?.barcode||d?.code||d?.value||json||'').trim();if(!code)return;const p=products.find(x=>String(x.barcode||'').trim()===code);if(!p){showToast('Товар со штрихкодом не найден');return;}addProduct(p);}catch(e){showToast('Не удалось обработать штрихкод');}};
    const finish=()=>finishInventorySession(session.id); document.getElementById('inv-finish').onclick=finish; document.getElementById('inv-finish-bottom').onclick=finish;
  };
  render();
}
async function finishInventorySession(sessionId){
  const session=inventorySessions.find(x=>x.id===sessionId&&x.status==='open'); if(!session)return;
  const root=document.getElementById('modal-root'); root.querySelectorAll('.inv-actual').forEach(el=>{const it=session.items?.[el.dataset.invId];if(it)it.actualQty=el.value===''?null:Math.max(0,Math.floor(Number(el.value)||0));});
  const items=Object.values(session.items||{}).filter(x=>x.actualQty!==null&&x.actualQty!==undefined);
  if(!items.length){showToast('Введите фактическое количество хотя бы для одного товара');return;}
  const calc=items.map(it=>{const book=Number(it.bookQty)||0,actual=Number(it.actualQty)||0,diff=actual-book;return {...it,bookQty:book,actualQty:actual,diff,cost:Number(it.cost)||0};});
  const diffCount=calc.filter(x=>x.diff!==0).length;
  const shortage=calc.filter(x=>x.diff<0).reduce((s,x)=>s+Math.abs(x.diff),0), surplus=calc.filter(x=>x.diff>0).reduce((s,x)=>s+x.diff,0);
  if(!confirm(`Завершить инвентаризацию?\nПозиций: ${items.length}\nОтклонений: ${diffCount}\nНедостача: ${shortage}\nИзлишек: ${surplus}`))return;
  applyInventorySession(session,calc);
}
async function applyInventorySession(session,items){
  const now=nowISO();
  var _invWhId=session.warehouseId||'wh-default';
  items.forEach(it=>{const p=products.find(x=>x.id===it.productId);if(!p)return;const diff=Number(it.diff)||0;var _st={...(p.stock||{})};_st[_invWhId]=Math.max(0,Number(it.actualQty)||0);p.stock=_st;p.qty=Object.keys(_st).reduce(function(s,k){return s+(Number(_st[k])||0);},0);p.updatedAt=nowISO();if(diff!==0)movements.push({id:uid(),type:'inventory',productId:p.id,productName:p.name,productSku:p.sku||'',qty:Math.abs(diff),date:now,note:`Инвентаризация · ${session.comment||'без комментария'}`,inventorySessionId:session.id,diffSign:diff>0?'+':'-',warehouseId:_invWhId});});
  session.closedAt=now;session.status='closed';
  session.summary={positions:items.length,diffCount:items.filter(x=>x.diff!==0).length,totalDiffSum:items.reduce((s,x)=>s+x.diff,0),shortage:items.filter(x=>x.diff<0).reduce((s,x)=>s+Math.abs(x.diff),0),surplus:items.filter(x=>x.diff>0).reduce((s,x)=>s+x.diff,0)};
  await Promise.all([persist('products'),persist('movements'),persist('inventorySessions')]);
  const root=document.getElementById('modal-root');root.innerHTML='';if(window._inventoryPrevScanner!==undefined){window.onBarcodeScanned=window._inventoryPrevScanner;window._inventoryPrevScanner=undefined;}showInventoryClosedScreen(session.id);
}
function showInventoryClosedScreen(sessionId){
  const s=inventorySessions.find(x=>x.id===sessionId);if(!s)return;const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="sheet-overlay" id="inv-closed-ov"><div class="sheet"><div class="sheet-handle"></div><div class="sheet-head"><div class="sheet-title">Инвентаризация завершена</div><button class="sheet-close" id="inv-closed-close">✕</button></div><div class="sheet-body"><div class="info-grid"><div class="info-card"><div class="info-label">Позиции</div><div class="info-value">${s.summary?.positions||0}</div></div><div class="info-card"><div class="info-label">Отклонения</div><div class="info-value">${s.summary?.diffCount||0}</div></div><div class="info-card"><div class="info-label">Недостача</div><div class="info-value">${s.summary?.shortage||0}</div></div><div class="info-card"><div class="info-label">Излишек</div><div class="info-value">${s.summary?.surplus||0}</div></div></div></div><div class="sheet-foot" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn" id="inv-closed-print">Печать акта</button><button class="btn btn-primary" id="inv-closed-done">Готово</button></div></div></div>`;
  const close=()=>{root.innerHTML='';safeRender();};document.getElementById('inv-closed-close').onclick=close;document.getElementById('inv-closed-done').onclick=close;document.getElementById('inv-closed-print').onclick=()=>printInventoryAct(s.id);
}
function buildInventoryPrintHtml(s){
  const rows=Object.values(s.items||{});return `<html><head><meta charset="utf-8"><title>Акт инвентаризации</title><style>body{font-family:Arial,sans-serif;padding:18px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left}.num{text-align:right}.line{border-top:1px solid #ccc;margin:12px 0}</style></head><body><h2>Акт инвентаризации</h2><div>Дата: ${escapeHtml(fmtDate(s.closedAt||s.startedAt))}</div><div>Ответственный: ${escapeHtml(s.startedByName||'')}</div><div>${escapeHtml(s.comment||'')}</div><div class="line"></div><table><thead><tr><th>Товар</th><th>SKU</th><th>Учёт</th><th>Факт</th><th>Отклонение</th></tr></thead><tbody>${rows.map(it=>`<tr><td>${escapeHtml(it.name||'')}</td><td>${escapeHtml(it.sku||'')}</td><td class="num">${Number(it.bookQty)||0}</td><td class="num">${Number(it.actualQty)||0}</td><td class="num">${Number(it.diff)||0}</td></tr>`).join('')}</tbody></table></body></html>`;
}
function printInventoryAct(sessionId){const s=inventorySessions.find(x=>x.id===sessionId);if(!s)return;const html=buildInventoryPrintHtml(s);if(window.Android&&typeof window.Android.printReceipt==='function'){try{window.Android.printReceipt(html);return;}catch(e){}}const w=window.open('','_blank');if(w){w.document.write(html);w.document.close();setTimeout(()=>w.print(),250);}}
function openInventorySessionDetail(sessionId){
  const s=inventorySessions.find(x=>x.id===sessionId);if(!s)return;const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="sheet-overlay" id="inv-detail-ov"><div class="sheet"><div class="sheet-head"><div class="sheet-title">Инвентаризация</div><button class="sheet-close" id="inv-detail-close">✕</button></div><div class="sheet-body"><div class="row-sub">${escapeHtml(s.startedByName||'')} · ${fmtDate(s.closedAt||s.startedAt)}</div><div class="panel" style="margin-top:10px"><div class="panel-body">Позиции: ${s.summary?.positions||0}<br>Отклонения: ${s.summary?.diffCount||0}<br>Недостача: ${s.summary?.shortage||0}<br>Излишек: ${s.summary?.surplus||0}</div></div></div><div class="sheet-foot"><button class="btn btn-primary btn-block" id="inv-detail-print">Печать акта</button></div></div></div>`;
  const close=()=>root.innerHTML='';document.getElementById('inv-detail-close').onclick=close;document.getElementById('inv-detail-print').onclick=()=>printInventoryAct(s.id);
}

  }
});

// Prevent number fields from turning 0 into 01 / 012 when the user types.
document.addEventListener('input', function(e){
  const el=e.target;
  if(!el || el.tagName!=='INPUT' || el.type!=='number') return;
  const v=String(el.value||'');
  if(/^0\d/.test(v)) el.value=v.replace(/^0+(?=\d)/,'');
});

['click','touchstart','keydown','input','scroll'].forEach(function(ev){ document.addEventListener(ev,function(){ if(activeUser&&!sessionLocked){ if(activeSession&&(!activeSession.lastActivityAt || (Date.now()-new Date(activeSession.lastActivityAt).getTime())>20000)) touchAuthSession(); } },{passive:true}); });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'&&activeUser)touchAuthSession(); });
window.addEventListener('beforeunload',function(){ if(activeSession)touchAuthSession(); });

// Native Android WebView calls this before exiting the Activity.
window.onAndroidBack=function(){
  try{
    if(!activeUser) return true;
    const root=document.getElementById('modal-root');
    if(root && root.innerHTML.trim()){ root.innerHTML=''; if(typeof window._inventoryPrevScanner!=='undefined'){ window.onBarcodeScanned=window._inventoryPrevScanner; window._inventoryPrevScanner=undefined; } return true; }
    if(typeof productSelectionMode!=='undefined' && productSelectionMode){ if(typeof exitProductSelection==='function') exitProductSelection(); return true; }
    if(typeof posCategoryOpen!=='undefined' && posCategoryOpen){ posCategoryOpen=false; if(typeof safeRender==='function')safeRender(); return true; }
    if(typeof ordersSubView!=='undefined' && currentView==='orders' && ordersSubView!=='pos'){ ordersSubView='pos'; if(typeof saveUiState==='function')saveUiState(); if(typeof safeRender==='function')safeRender(); return true; }
    if(typeof currentView!=='undefined' && currentView!=='orders'){ currentView='orders'; ordersSubView='pos'; if(typeof saveUiState==='function')saveUiState(); if(typeof safeRender==='function')safeRender(); return true; }
    const ok=confirm('Выйти из программы?');
    if(ok && window.Android && typeof window.Android.closeApp==='function') window.Android.closeApp();
    return true;
  }catch(e){ try{console.error('Android back error',e);}catch(_){} return true; }
};

try{ window.CORE_MODULES=CORE_MODULES; window.defaultModulesConfig=defaultModulesConfig; window.ROLE_ACCESS=ROLE_ACCESS; window.ROLE_NAV=ROLE_NAV; window.SEARCH_SYNONYMS=SEARCH_SYNONYMS; }catch(e){}
